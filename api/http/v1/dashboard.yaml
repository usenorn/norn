        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [saved-views]
      operationId: updateWorkspaceSavedView
      summary: Rename a view, re-scope who it is shared with, or replace what it asks for
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SavedViewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedViewRequest' }
      responses:
        '200':
          description: The view as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
