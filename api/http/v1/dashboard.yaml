        '201':
          description: The view that was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/saved-views/order:
    put:
      tags: [saved-views]
      operationId: reorderWorkspaceSavedViews
      summary: Arrange saved views for the caller alone
      description: >-
        The order belongs to whoever set it. Naming a subset is allowed, so a colleague sharing
