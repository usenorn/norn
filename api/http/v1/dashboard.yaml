        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/teams/{teamId}/agent-settings:
    get:
      tags: [agents]
      operationId: getTeamAgentSettings
