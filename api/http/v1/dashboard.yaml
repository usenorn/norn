      tags: [states]
      operationId: setDefaultWorkflowState
      summary: Make this the state new issues start in
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/StateId'
      responses:
        '200':
          description: The team's states, with the new default flagged
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/teams/{teamId}/states/{stateId}/completion:
    post:
      tags: [states]
      operationId: setCompletionWorkflowState
      summary: Make this the state that counts as done
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/StateId'
      responses:
        '200':
          description: The team's states, with the new completion state flagged
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/progress:
    get:
      tags: [issues]
      operationId: getWorkspaceIssueProgress
      summary: Report per-category tallies over the issues the caller may see
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: cycleId
          in: query
          description: Tally one cycle instead of a team; takes precedence over teamId
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          description: >-
            Tally one project instead of a team. Counted through the caller's own team scope, so a
            project drawing on a team they cannot see reports only their share of it.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Per-category tallies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues:
    get:
      tags: [issues]
      operationId: listWorkspaceIssues
      summary: List the issues the caller may see, newest first
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: cycleId
          in: query
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Repeat to include more than one; defaults to active issues only
          schema:
            type: array
            items: { $ref: '#/components/schemas/IssueStatus' }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of visible issues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [issues]
      operationId: createWorkspaceIssue
      summary: Raise an issue in a team the caller can see
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
