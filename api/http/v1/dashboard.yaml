        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [agents]
      operationId: disableWorkspaceAgent
      summary: Disable an agent at once, keeping everything it has already done
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '204':
          description: The agent was disabled and its credentials revoked
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agents/{agentId}/enable:
    post:
      tags: [agents]
