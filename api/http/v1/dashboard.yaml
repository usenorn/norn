      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [source-control]
      operationId: getWorkspaceIssueBranchName
      summary: Get the branch name to start work on this issue
      responses:
        '200':
          description: The branch name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueBranchName' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/code-automation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
    put:
      tags: [source-control]
      operationId: suppressWorkspaceIssueAutomation
      summary: Stop or resume source control moving this issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressIssueAutomationRequest' }
      responses:
        '204': { description: The issue's automation setting is stored }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/code-links:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [source-control]
      operationId: listWorkspaceIssueCodeLinks
      summary: List the branches, commits and changes linked to this issue
      responses:
        '200':
          description: What code is attached to the issue, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodeLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [source-control]
      operationId: linkWorkspaceIssueCode
      summary: Link a change to this issue by pasting its address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkIssueCodeRequest' }
      responses:
        '201':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/code-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
      - $ref: '#/components/parameters/CodeLinkId'
    delete:
      tags: [source-control]
      operationId: unlinkWorkspaceIssueCode
      summary: Remove a link somebody made or a scan got wrong
      responses:
        '204': { description: The link is gone }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/mirrors:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [source-control]
      operationId: listWorkspaceIssueMirrors
      summary: Read the platform issues this one is kept in step with
      responses:
        '200':
          description: The mirrors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IssueMirror' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [source-control]
      operationId: mirrorWorkspaceIssue
      summary: Pair this issue with one that already exists on the platform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MirrorIssueRequest' }
      responses:
        '201':
          description: The mirror
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueMirror' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/SourceControlConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/SourceControlRateLimited' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/mirrors/{mirrorId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
      - $ref: '#/components/parameters/IssueMirrorId'
    delete:
      tags: [source-control]
      operationId: unmirrorWorkspaceIssue
      summary: Stop keeping this issue in step, leaving both where they are
      responses:
        '204': { description: The pairing is gone }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners:
    post:
      tags: [runners]
      operationId: enrolRunner
      summary: Bind this machine to the agent whose token authorises the call
      description: >-
        The bearer token is an ordinary agent API token, the same one an MCP client uses. It says
        which agent this machine may act as and is read once: it is never stored, and it is not
        what the machine keeps. What comes back is a refresh secret bound to the device key, shown
        here and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrolRunnerRequest' }
      responses:
        '201':
          description: The runner, carrying its refresh secret for the only time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolledRunner' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RunnerConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/token:
    post:
      tags: [runners]
      operationId: exchangeRunnerToken
      summary: Trade a signed assertion for a short-lived access token and a channel ticket
      description: >-
        Authenticated by the refresh secret and an Ed25519 signature over the assertion, both
        carried in the body, so this endpoint takes no session and no bearer token. The signature
        covers the version, the runner id, the nonce, the timestamp and the audience, joined by
        newlines. A nonce is accepted once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeRunnerTokenRequest' }
      responses:
        '200':
          description: A scoped access token and a single-use channel ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerSession' }
        '401': { $ref: '#/components/responses/RunnerCredential' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me:
    get:
      tags: [runners]
      operationId: getCurrentRunner
      summary: What this machine is, as the server sees it
      responses:
        '200':
          description: The calling runner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runners:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [runners]
      operationId: listWorkspaceRunners
      summary: Every machine connected to this workspace, newest first
      responses:
        '200':
          description: The runners on record, live and revoked
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runners/{runnerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunnerId'
    delete:
      tags: [runners]
      operationId: revokeWorkspaceRunner
      summary: Cut this machine off, leaving its agent working everywhere else
      responses:
        '204': { description: The runner was revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runners/{runnerId}/pause:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunnerId'
    post:
      tags: [runners]
      operationId: pauseWorkspaceRunner
      summary: Stop offering this machine new work, leaving what it is running alone
      responses:
        '200':
          description: The runner as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runners/{runnerId}/resume:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunnerId'
    post:
      tags: [runners]
      operationId: resumeWorkspaceRunner
      summary: Let this machine take work again
      responses:
        '200':
          description: The runner as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/codebases:
    get:
      tags: [codebases]
      operationId: listCurrentRunnerCodebases
      summary: Every folder this machine has connected
      responses:
        '200':
          description: The codebases on record for the calling runner
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [codebases]
      operationId: connectCodebase
      summary: Report what a connected folder holds
      description: >-
        Idempotent on the root path. The first call connects the folder; a later call carrying a
        different set of repositories replaces the inventory and marks the codebase as drifted
        until a person confirms it on the machine. Remote URLs are sent as fingerprints, never in
        full.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectCodebaseRequest' }
      responses:
        '200':
          description: The codebase as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CodebaseConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/codebases/{codebaseId}:
    parameters:
      - $ref: '#/components/parameters/CodebaseId'
    patch:
      tags: [codebases]
      operationId: confirmCodebase
      summary: Accept the inventory as it was last reported, clearing drift
      responses:
        '200':
          description: The codebase, no longer drifted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CodebaseConflict' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [codebases]
      operationId: disconnectCodebase
      summary: Stop offering this folder, leaving its record readable
      responses:
        '200':
          description: The codebase, now disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CodebaseConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agents/{agentId}/codebases:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [codebases]
      operationId: listAgentCodebases
      summary: The folders this agent's machines hold
      description: >-
        A runner is somebody's own machine, so this serves the agent's owner and workspace
        administrators. Anyone else is told the agent does not exist rather than that they may not
        look. There is deliberately no workspace-wide codebase listing.
      responses:
        '200':
          description: The codebases held by this agent's runners, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agents/{agentId}/codebases/{codebaseId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/CodebaseId'
    delete:
      tags: [codebases]
      operationId: disconnectAgentCodebase
      summary: Stop using this folder, leaving everything that already named it resolvable
      description: >-
        Disconnecting is a state rather than a deletion, so a run that named this folder keeps
        reading. Served to the agent's owner and workspace administrators, the same as the listing.
      responses:
        '200':
          description: The codebase, now disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Codebase' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CodebaseConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/executions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [executions]
      operationId: listWorkspaceIssueExecutions
      summary: Every run this issue has had, newest attempt first
      responses:
        '200':
          description: The executions on record for this issue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/changeset:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [executions]
      operationId: getWorkspaceIssueChangeSet
      summary: What the runs on this issue changed, as one result
      description: >-
        One row per repository across every attempt, each carrying what the most recent run to
        touch it did. A re-run amends this rather than starting a second result beside it.
      responses:
        '200':
          description: The changes on record for this issue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueChangeSet' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutions
      summary: The runs in this workspace, most recently finished first
      description: >-
        Only runs on issues the caller may read. Pass state to narrow it, which is how the review
        queue asks for the runs waiting for somebody.
      parameters:
        - name: state
          in: query
          required: false
          description: Repeat it to ask for more than one state. Left out, every state is answered.
          schema:
            type: array
            items: { $ref: '#/components/schemas/ExecutionState' }
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The runs on record
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: getWorkspaceExecution
      summary: One run, with the beginning of its timeline
      description: >-
        The timeline here is the first page, oldest first, so the screen renders in one request.
        Page the rest through the timeline path.
      responses:
        '200':
          description: The execution and the opening of its history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/timeline:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutionTimeline
      summary: What happened during this run, oldest first
      parameters:
        - name: after
          in: query
          description: The sequence of the last entry already held
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The next page of the timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionEvent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: cancelWorkspaceExecution
      summary: Stop this run and tell the machine to tear it down
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelExecutionRequest' }
      responses:
        '200':
          description: The execution as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/restart:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: restartWorkspaceExecution
      summary: Run this issue again, as a fresh attempt
      description: >-
        A finished run is never reopened. This offers the same delegation to the machine again as
        the next attempt, so the failed run's timeline stays readable beside the new one.
      responses:
        '201':
          description: The new attempt, waiting for the machine to accept it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/resume:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: resumeWorkspaceExecution
      summary: Send this run back to work with feedback
      description: >-
        The same run continues in the same folder with the same branches and the same session, and
        the feedback is handed to the coding agent verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeExecutionRequest' }
      responses:
        '200':
          description: The execution as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/approve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: approveWorkspaceExecution
      summary: Accept what this run produced
      responses:
        '200':
          description: The execution as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/services:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutionServices
      summary: What this run is running, on which ports, and how it is
      description: >-
        A service exists here because the machine reported one. What it printed is in the run's
        output under the service's own name.
      responses:
        '200':
          description: The services on record for this run
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionService' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/previews:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [previews]
      operationId: listWorkspaceExecutionPreviews
      summary: The previews this run has opened, and who they are shared with
      description: >-
        A preview exists because the machine reported one. Nothing else creates one, so an address
        this list does not carry is an address the gateway will not route.
      responses:
        '200':
          description: The previews on record for this run
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionPreviewDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/previews/{previewName}/share:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/PreviewName'
    post:
      tags: [previews]
      operationId: sharePreview
      summary: Mint a link that lets somebody outside the workspace look
      description: >-
        The link is answered once and never again; norn keeps only its hash. Give it a passcode
        when the address alone should not be enough.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharePreviewRequest' }
      responses:
        '201':
          description: The link, and the only time its address is answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewShareLinkMinted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/PreviewConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/previews/{previewName}/share/{shareLinkId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/PreviewName'
      - $ref: '#/components/parameters/ShareLinkId'
    delete:
      tags: [previews]
      operationId: revokePreviewShareLink
      summary: Withdraw a share link, and everyone it has already let in
      responses:
        '204':
          description: The link is withdrawn
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/retain:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [previews]
      operationId: retainWorkspaceExecution
      summary: Keep this run's workspace and previews for longer
      description: >-
        The machine owns the clock, so this asks it to hold what it is holding until later. It is
        offered while a run is waiting for review, which is when somebody is still looking.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetainExecutionRequest' }
      responses:
        '200':
          description: The execution as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /previews/authorize:
    get:
      tags: [previews]
      operationId: authorizePreview
      summary: Trade a session for one short-lived look at a preview
      description: >-
        Where the gateway sends a browser that has no preview session yet. A signed-out browser is
        sent into sign-in and returns here; a signed-in one is sent back to the preview carrying a
        single-use ticket the gateway exchanges for the session.
      parameters:
        - name: host
          in: query
          required: true
          description: The preview host the browser asked for
          schema: { type: string, maxLength: 255 }
        - name: return
          in: query
          description: The path inside the preview to land on
          schema: { type: string, maxLength: 2048 }
      responses:
        '303':
          description: Follow this link. It is single use, and it expires in a minute.
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/PreviewConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/executions/{executionId}/logs:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: uploadExecutionLogs
      summary: Send a batch of this run's command output
      description: >-
        Command output is too voluminous for the channel, so it travels here instead. A batch is
        stored whole and identified by the digest of what it carries, so a machine that replays
        one after a reconnect is answered with the receipt it already had rather than storing it
        twice. Send the body gzipped with Content-Encoding when it is worth compressing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadExecutionLogsRequest' }
      responses:
        '202':
          description: What the server holds for this batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionChunkReceipt' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/executions/{executionId}/transcript:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: uploadExecutionTranscript
      summary: Send a chunk of the coding agent's normalised event stream
      description: >-
        Ordered by sequence and resumable: ask the streams path what the server already holds and
        carry on from there. A workspace whose telemetry is minimal refuses these and says so.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadExecutionTranscriptRequest' }
      responses:
        '202':
          description: What the server holds for this chunk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionChunkReceipt' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/executions/{executionId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [executions]
      operationId: uploadExecutionArtifact
      summary: Publish a file this run produced
      description: >-
        A diff, a screenshot, a report. The id that comes back is what the timeline and the
        ChangeSet reference. A file sent twice keeps the first id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The artifact as the server now holds it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionArtifactReceipt' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ExecutionConflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /runners/me/executions/{executionId}/streams:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: getExecutionStreams
      summary: How far each of this run's streams got
      description: >-
        What a machine reads after a restart to know where to carry on from, so a reconnect
        resends nothing it does not have to.
      responses:
        '200':
          description: One cursor per stream the server holds anything for
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionStreamCursor' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/questions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [questions]
      operationId: listWorkspaceExecutionQuestions
      summary: What this run stopped to ask, and what came back
      responses:
        '200':
          description: Every question this run asked, in the order it asked them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueQuestionList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/logs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutionLogs
      summary: What this run printed, oldest batch first
      parameters:
        - name: after
          in: query
          description: The sequence of the last batch already held
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: The next batches of output
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionLogChunk' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/transcript:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutionTranscript
      summary: What the coding agent did, oldest chunk first
      description: >-
        Empty once the retention window has passed, or where the workspace keeps summaries only.
        The timeline is kept either way.
      parameters:
        - name: after
          in: query
          description: The sequence of the last chunk already held
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: The next chunks of the transcript
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionTranscriptChunk' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [executions]
      operationId: listWorkspaceExecutionArtifacts
      summary: The files this run published, oldest first
      responses:
        '200':
          description: The artifacts on record
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionArtifact' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/executions/{executionId}/artifacts/{artifactId}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [executions]
      operationId: downloadWorkspaceExecutionArtifact
      summary: Fetch the bytes of one artifact
      description: Answers with a short-lived link to the stored object rather than the bytes.
      responses:
        '303':
          description: The artifact is at the location given
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/execution-policy:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [executions]
      operationId: getWorkspaceExecutionPolicy
      summary: Read how much of a run this workspace keeps, and for how long
      responses:
        '200':
          description: The workspace execution policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExecutionPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [executions]
      operationId: setWorkspaceExecutionPolicy
      summary: Set how much of a run this workspace keeps, and for how long
      description: >-
        On minimal the server stops accepting full transcripts, so the setting holds even against
        a machine that has not noticed it changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceExecutionPolicyRequest' }
      responses:
        '200':
          description: The policy as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExecutionPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: norn_session
      description: >-
        The cookie is norn_session_<slot>, one per signed-in session, HttpOnly and host-only, and
        a browser may present several at once. Which one acts is named by the X-Norn-Session
        header, or by the s query parameter for the one caller that cannot set a header. Naming a
        session the request did not present authenticates nobody and never falls back to another.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

    CodebaseId:
      name: codebaseId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }

    PreviewName:
      name: previewName
      in: path
      required: true
      schema: { type: string, maxLength: 30 }

    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      schema: { type: string, format: uuid }

    RunnerId:
      name: runnerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StateId:
      name: stateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }

    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SavedViewId:
      name: savedViewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LabelId:
      name: labelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DirectoryLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    DirectoryCursor:
      name: cursor
      in: query
      schema: { type: string, format: date-time }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    AuditCursor:
      name: cursor
      in: query
      schema: { type: string }
    AuditActorFilter:
      name: actor
      in: query
      schema: { type: string, format: uuid }
    AuditActionFilter:
      name: action
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/AuditAction' }
    AuditResourceKind:
      name: resourceKind
      in: query
      schema: { type: string }
    AuditResourceId:
      name: resourceId
      in: query
      schema: { type: string, format: uuid }
    AuditFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    ActivityLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    ActivityCursor:
      name: cursor
      in: query
      schema: { type: string }
    ActivityOrder:
      name: order
      in: query
      description: Oldest first tells the story forward; newest first shows what just happened.
      schema: { type: string, enum: [oldest, newest] }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Reaction:
      name: reaction
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CommentReaction' }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }

    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    WebhookDeliveryCursor:
      name: cursor
      in: query
      schema: { type: string }
    WebhookDeliveryEventFilter:
      name: event
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/WebhookDeliveryEventType' }
    WebhookDeliveryStateFilter:
      name: state
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/WebhookDeliveryState' }

    SourceControlRepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }

    SourceControlRouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }

    IssueMirrorId:
      name: mirrorId
      in: path
      required: true
      schema: { type: string, format: uuid }

    SourceControlConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CodeLinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportRunId:
      name: importRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportRunLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 100 }
    ImportRunCursor:
      name: cursor
      in: query
      schema: { type: string }

    NotificationSubjectKind:
      name: subjectKind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationSubjectKind' }

    NotificationSubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: A problem occurred
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TeamConflict:
      description: The key is taken, or the team or workspace refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TeamConflictProblem' }

    MembershipConflict:
      description: The membership refuses the change, or the workspace does
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MembershipConflictProblem' }

    SignInRejected:
      description: The email and password did not match
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvalidCredentialsProblem' }

    SignInCodeRejected:
      description: The code did not match the one that was sent
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignInCodeIncorrectProblem' }

    AccountLocked:
      description: Consecutive failures locked the account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AccountLockedProblem' }

    TooManyAttempts:
      description: The caller exceeded the attempt limit for its address
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RateLimitedProblem' }

    PasswordResetLinkExpired:
      description: The reset link expired, was superseded, or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkExpiredProblem' }

    PasswordResetLinkUsed:
      description: The reset link was already used
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkUsedProblem' }

    AgentUnusable:
      description: The agent cannot complete the requested lifecycle or proposal operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AgentUnusableProblem' }
    AgentHeld:
      description: The action is waiting for a person to approve it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AgentHeldProblem' }
    APITokenUnusable:
      description: The token name is taken, or its scopes exceed the caller's rights
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/APITokenUnusableProblem' }

    WorkflowStateConflict:
      description: The state cannot change without leaving the team unusable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkflowStateConflictProblem' }

    StorageRefused:
      description: The file is too big, or the workspace has no room for it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StorageRefusedProblem' }

    CommentConflict:
      description: The comment refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CommentConflictProblem' }

    IssueConflict:
      description: The issue changed since it was read
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/IssueConflictProblem' }

    RunnerCredential:
      description: The runner's credential, signature or assertion was refused
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RunnerProblem' }

    RunnerConflict:
      description: Another live machine on this agent already holds that name
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RunnerProblem' }

    CodebaseConflict:
      description: The codebase refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CodebaseProblem' }

    ExecutionConflict:
      description: The execution refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }

    PreviewConflict:
      description: The preview or its share link refuses the request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PreviewProblem' }

    CycleConflict:
      description: The cycle refuses the change, or needs a decision first
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CycleConflictProblem' }

    ProjectConflict:
      description: The project refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProjectConflictProblem' }

    SavedViewConflict:
      description: The view refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SavedViewConflictProblem' }

    LabelConflict:
      description: The label cannot change without losing or duplicating work
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LabelConflictProblem' }

    SsoFailed:
      description: The exchange with the provider broke at a named stage
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SsoProblem' }

    EnforcementRefused:
      description: Single sign-on cannot be required for this workspace yet
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/EnforcementRefusedProblem' }

    Forbidden:
      description: The actor may not perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ForbiddenProblem' }

    SignUpUnavailable:
      description: The instance does not create accounts from the sign-up form
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpClosedProblem' }

    SignUpNotProcessable:
      description: The password could not be screened, or the link could not be sent
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpUnavailableProblem' }

    SignUpLinkExpired:
      description: The sign-up link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpExpiredProblem' }

    SignUpLinkUnusable:
      description: The link was already used, or an account already has the address
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpUnusableProblem' }

    DirectoryUnlicensed:
      description: This instance has no licence covering directory synchronization
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DirectoryUnlicensedProblem' }
    AuditUnlicensed:
      description: This instance has no licence covering the audit log
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AuditUnlicensedProblem' }
    WebhookDestinationRefused:
      description: The destination is not reachable from this instance
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WebhookDestinationRefusedProblem' }
    WebhookSigningUnavailable:
      description: This instance has no encryption key, so a webhook cannot be signed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WebhookSigningUnavailableProblem' }
    SourceControlRefused:
      description: The forge refused the credentials, or could not reach the repository
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SourceControlRefusedProblem' }
    SourceControlConflict:
      description: The repository is already connected, or the issue is already mirrored
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SourceControlConflictProblem' }
    SourceControlRateLimited:
      description: The forge is rate limiting this instance
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SourceControlSealingUnavailable:
      description: This instance has no encryption key, so a token cannot be sealed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SourceControlSealingUnavailableProblem' }
    ImportConflict:
      description: The run cannot take this step from where it stands
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ImportConflictProblem' }
    ImportSourceRefused:
      description: The source refused to hand over what the import asked it for
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ImportSourceRefusedProblem' }
    ImportSourceRateLimited:
      description: The source is throttling this instance
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RateLimitedProblem' }
    ImportSigningUnavailable:
      description: This instance has no encryption key, so a source key cannot be stored or read
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ImportSigningUnavailableProblem' }
    BreachCheckUnavailable:
      description: The password breach check could not be completed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BreachCheckUnavailableProblem' }

    InvitationLinkExpired:
      description: The invitation link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationExpiredProblem' }

    InvitationLinkUnusable:
      description: The invitation was revoked, already accepted, or addressed to someone else
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationUnusableProblem' }

    WorkspaceDeleted:
      description: The workspace is pending deletion and accepts nothing but restore
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkspaceDeletedProblem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }

    InvalidCredentialsProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, attemptsLeft]
          properties:
            code: { type: string, enum: [invalid_credentials] }
            attemptsLeft: { type: integer, format: int32, minimum: 0 }

    AccountLockedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, unlocksAt]
          properties:
            code: { type: string, enum: [account_locked] }
            unlocksAt: { type: string, format: date-time }

    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [rate_limited] }

    ResetLinkExpiredProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_expired] }

    ResetLinkUsedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_used] }

    LabelColor:
      type: string
      enum: [neutral, cyan, blue, violet, orchid, magenta]

    Label:
      type: object
      required: [id, workspaceId, name, color]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }

    LabelGroup:
      type: object
      required: [id, workspaceId, name]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }

    LabelUsage:
      type: object
      required: [issues]
      properties:
        issues: { type: integer, format: int32 }

    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }

    IssueStatus:
      type: string
      enum: [active, archived, pending_deletion]

    SetIssueStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/IssueStatus' }
        expectedVersion: { type: integer, format: int32 }

    BulkOutcome:
      type: string
      enum: [applied, unchanged, forbidden, not_found, conflict, invalid]

    BulkActionStatus:
      type: string
      enum: [queued, running, complete, failed]

    BulkChange:
      type: object
      description: Exactly one lifecycle change, or any combination of property changes
      properties:
        stateId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        clearAssignee: { type: boolean }
        addLabelId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        status: { $ref: '#/components/schemas/IssueStatus' }

    BulkFilter:
      type: object
      description: The set is resolved when the action runs, with the caller's own visibility
      properties:
        teamId: { type: string, format: uuid }
        status:
          type: array
          items: { $ref: '#/components/schemas/IssueStatus' }
        filter: { $ref: '#/components/schemas/IssueFilter' }

    BulkChangeRequest:
      type: object
      required: [change]
      properties:
        change: { $ref: '#/components/schemas/BulkChange' }
        issueIds:
          type: array
          items: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/BulkFilter' }

    BulkActionOutcome:
      type: object
      required: [issueId, reference, outcome]
      properties:
        issueId: { type: string, format: uuid }
        reference: { type: string }
        outcome: { $ref: '#/components/schemas/BulkOutcome' }

    BulkActionResult:
      type: object
      required: [id, status, processed, outcomes]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BulkActionStatus' }
        processed: { type: integer, format: int32 }
        expected:
          type: integer
          format: int32
          nullable: true
          description: Absent for a filter-defined set, whose size is not known in advance
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/BulkActionOutcome' }

    IssueRelationKind:
      type: string
      description: A relation as seen from the issue you are looking at
      enum: [blocks, blocked_by, duplicates, duplicated_by, relates_to]

    IssueRelation:
      type: object
      required: [id, kind, issue]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/IssueRelationKind' }
        issue: { $ref: '#/components/schemas/Issue' }
        createdAt: { type: string, format: date-time }

    IssueRelationGroup:
      type: object
      required: [kind, relations]
      properties:
        kind: { $ref: '#/components/schemas/IssueRelationKind' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/IssueRelation' }

    IssueRelationGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/IssueRelationGroup' }

    AddIssueRelationRequest:
      type: object
      required: [kind, issueId]
      properties:
        kind: { $ref: '#/components/schemas/IssueRelationKind' }
        issueId:
          type: string
          format: uuid
          description: The issue at the other end, as seen from this one
        closeDuplicate:
          type: boolean
          description: Also move the duplicate to its team's abandoned state

    SetIssueParentRequest:
      type: object
      required: [expectedVersion, parentId]
      properties:
        expectedVersion: { type: integer, format: int32 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null detaches the issue, leaving it and its sub-tree standing alone

    IssueChildren:
      type: object
      required: [issues, progress]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        progress: { $ref: '#/components/schemas/IssueProgress' }

    IssueQuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: '#/components/schemas/IssueQuestion' }

    IssueQuestionKind:
      type: string
      enum: [decision, clarification, approval]

    IssueQuestionState:
      type: string
      enum: [asked, answered, dismissed, expired]

    IssueQuestionContext:
      type: object
      description: What the agent was looking at when it stopped to ask.
      properties:
        preview: { type: string }
        files:
          type: array
          items: { type: string }
        artifacts:
          type: array
          items: { type: string, format: uuid }

    IssueQuestion:
      type: object
      required: [id, issueId, kind, state, blocking, allowFreeText, question, default, deadline,
                 answered, expired, standing, actorKind, createdAt]
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        executionId:
          type: string
          maxLength: 64
          description: The run that asked, when a run did. Absent when a person or a tool did.
        kind: { $ref: '#/components/schemas/IssueQuestionKind' }
        state: { $ref: '#/components/schemas/IssueQuestionState' }
        blocking:
          type: boolean
          description: >-
            True when the run stopped for this and is waiting on an answer to go anywhere.
        options:
          type: array
          description: The answers the agent offered. Empty when it asked an open question.
          items: { type: string }
        allowFreeText:
          type: boolean
          description: False when only one of the offered options will do.
        context: { $ref: '#/components/schemas/IssueQuestionContext' }
        question: { type: string }
        default:
          type: string
          description: What the agent said it would do if nobody answered before the deadline.
        deadline: { type: string, format: date-time }
        answered: { type: boolean }
        expired:
          type: boolean
          description: True once the deadline passed with no answer, so the default is what stands.
        standing:
          type: string
          description: The answer if there is one, otherwise the declared default.
        answer: { type: string }
        askedByName: { type: string }
        actorKind: { $ref: '#/components/schemas/NotificationActorKind' }
        answeredByName: { type: string }
        answeredAt: { type: string, format: date-time }
        settledByName:
          type: string
          description: Who decided this question, however they decided it.
        settledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AskIssueQuestionRequest:
      type: object
      required: [question, default]
      properties:
        question: { type: string, maxLength: 1000 }
        default: { type: string, maxLength: 2000 }
        waitSeconds:
          type: integer
          format: int32
          description: How long to wait for an answer before the default stands. Defaults to a day.

    AnswerIssueQuestionRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, maxLength: 2000 }

    IssueDelegation:
      type: object
      required: [id, issueId, agentId, agentName, agentAccountId, delegatedAt]
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        agentAccountId:
          type: string
          format: uuid
          description: The account the agent writes as, so its work can be attributed to it
        brief:
          type: string
          description: What the agent was asked to do, carried to whatever runtime picks the work up
        params: { $ref: '#/components/schemas/DelegationParams' }
        delegatedByAccountId: { type: string, format: uuid }
        delegatedAt: { type: string, format: date-time }
        recalledByAccountId: { type: string, format: uuid }
        recalledAt:
          type: string
          format: date-time
          description: Absent while the delegation is open

    PermissionProfile:
      type: string
      enum: [strict, standard, unrestricted]

    BaseRefPolicy:
      type: string
      enum: [origin/default, head]

    RuntimeChoice:
      type: string
      enum: [auto, process, docker]

    DelegationParams:
      type: object
      description: >-
        What the delegation asked for. Every attempt against it inherits these, and what is left
        unset is the machine's own setting rather than a default this server invents.
      properties:
        tool: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        runtime: { $ref: '#/components/schemas/RuntimeChoice' }
        baseRef: { $ref: '#/components/schemas/BaseRefPolicy' }
        includeDirty:
          type: boolean
          description: Carry the folder's uncommitted work into the run as one commit
        permissionProfile: { $ref: '#/components/schemas/PermissionProfile' }

    DelegateIssueRequest:
      type: object
      required: [agentAccountId]
      properties:
        agentAccountId:
          type: string
          format: uuid
          description: >-
            The account the agent writes as, which is how it appears in the member list. Listing
            the agents themselves is an administrator's view, so this is what an ordinary member
            has to hand.
        brief: { type: string, maxLength: 4000 }
        params: { $ref: '#/components/schemas/DelegationParams' }

    RunnerReadiness:
      type: object
      required: [runnerId, name, connected, reaches, paused, capacity, used, free, diskPressure]
      properties:
        runnerId: { type: string, format: uuid }
        name: { type: string }
        connected:
          type: boolean
          description: Whether the machine is holding a channel right now
        reaches:
          type: boolean
          description: Whether this machine's team scope covers the issue's team
        paused: { type: boolean }
        capacity: { type: integer, format: int32 }
        used: { type: integer, format: int32 }
        free: { type: integer, format: int32 }
        diskPressure: { type: boolean }

    SharedRepositoryWarning:
      type: object
      required: [executionId, reference, state]
      properties:
        executionId: { type: string }
        reference: { type: string }
        state: { $ref: '#/components/schemas/ExecutionState' }

    DelegationTargets:
      type: object
      required: [agentId, agentAccountId, agentName, runners, warnings]
      properties:
        agentId: { type: string, format: uuid }
        agentAccountId: { type: string, format: uuid }
        agentName: { type: string }
        runners:
          type: array
          items: { $ref: '#/components/schemas/RunnerReadiness' }
        runnerId:
          type: string
          format: uuid
          description: The machine the work would land on. Absent when it would wait instead.
        waiting:
          allOf:
            - $ref: '#/components/schemas/ExecutionQueuedReason'
          description: Why it would wait. Absent when a machine would take it straight away.
        warnings:
          type: array
          description: >-
            Active runs already touching a repository this one would touch. Worth saying, never a
            reason to refuse.
          items: { $ref: '#/components/schemas/SharedRepositoryWarning' }

    MoveIssueRequest:
      type: object
      required: [teamId, expectedVersion]
      properties:
        teamId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int32 }
        acknowledgeLabelLoss: { type: boolean }

    UpdateLabelRequest:
      type: object
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        groupId:
          type: string
          format: uuid
          nullable: true

    MergeLabelRequest:
      type: object
      required: [intoLabelId]
      properties:
        intoLabelId: { type: string, format: uuid }

    LabelGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    SetIssueLabelsRequest:
      type: object
      required: [labelIds, expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int32 }
        labelIds:
          type: array
          items: { type: string, format: uuid }

    LabelConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - label_name_taken
                - label_group_name_taken
                - label_group_exclusive
                - label_group_in_use
                - label_usage_changed
                - label_merge_scope_narrows
                - label_merge_group_mismatch
            issues: { type: integer, format: int32 }

    StateCategory:
      type: string
      enum: [not_started, active, complete, abandoned]

    WorkflowState:
      type: object
      required: [id, teamId, name, category, position, isDefault, isCompletion]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/StateCategory' }
        position: { type: integer, format: int32 }
        isDefault: { type: boolean }
        isCompletion: { type: boolean }

    CreateWorkflowStateRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/StateCategory' }

    UpdateWorkflowStateRequest:
      type: object
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/StateCategory' }

    ReorderWorkflowStatesRequest:
      type: object
      required: [stateIds]
      properties:
        stateIds:
          type: array
          items: { type: string, format: uuid }

    WorkflowStateConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - state_name_taken
                - state_last_in_category
                - state_is_default
                - state_is_completion

    IssuePriority:
      type: string
      enum: [urgent, high, medium, low, none]

    UpdateIssueRequest:
      type: object
      required: [expectedVersion]
      properties:
        acknowledgeOpenChildren:
          type: boolean
          description: Complete this issue even though children of it are still open
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }
        expectedVersion: { type: integer, format: int32 }
        title: { type: string }
        stateId: { type: string, format: uuid }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        assigneeId: { type: string, format: uuid }
        estimate: { type: integer, format: int32 }
        dueOn: { type: string, format: date }
        cycleId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        afterIssueId:
          type: string
          format: uuid
          description: >-
            Place this issue immediately after the named one in rank order. Send it with
            `beforeIssueId` to drop between two issues, alone to drop at the end, or send only
            `beforeIssueId` to drop at the start. The server works out the rank, so two people
            dropping in the same gap cannot land on the same one.
        beforeIssueId:
          type: string
          format: uuid
          description: Place this issue immediately before the named one in rank order.
        clear:
          type: array
          description: Properties to reset; absent means unchanged, which a nullable field cannot express
          items:
            type: string
            enum: [assignee, estimate, dueOn, cycle, project]

    Attachment:
      type: object
      required: [id, workspaceId, issueId, fileName, contentType, byteSize, status, inline, contentPath, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        commentId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/AttachmentStatus' }
        inline:
          type: boolean
          description: Whether Norn will serve this file for display rather than download.
        contentPath:
          type: string
          description: The same-origin path that trades issue access for the bytes.
        uploadedByAccountId: { type: string, format: uuid }
        uploadedByName: { type: string }
        createdAt: { type: string, format: date-time }

    AttachmentStatus:
      type: string
      description: A file is pending until its bytes have landed and been settled.
      enum: [pending, stored, discarded]

    AttachmentList:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }

    ReserveAttachmentRequest:
      type: object
      required: [fileName, byteSize]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, maxLength: 255 }
        byteSize: { type: integer, format: int64, minimum: 1 }

    AttachmentReservation:
      type: object
      required: [attachment, transfer]
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        transfer: { $ref: '#/components/schemas/AttachmentTransfer' }

    AttachmentTransfer:
      type: object
      description: One request that carries the bytes, wherever they are meant to go.
      required: [url, method, headers, expiresAt]
      properties:
        url: { type: string }
        method: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    WorkspaceStorage:
      type: object
      required: [storedBytes, unlimited]
      properties:
        storedBytes: { type: integer, format: int64 }
        maxBytes: { type: integer, format: int64 }
        unlimited: { type: boolean }
        updatedAt: { type: string, format: date-time }

    StorageRefusedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - attachment_too_large
                - workspace_storage_exhausted
                - attachment_not_pending
                - attachment_missing
            byteSize: { type: integer, format: int64 }
            storedBytes: { type: integer, format: int64 }
            maxBytes: { type: integer, format: int64 }

    IssueCommentPage:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/IssueComment' }
        nextCursor: { type: string }

    IssueComment:
      type: object
      required: [id, issueId, authorKind, body, edited, deleted, mentions, reactions, replies, createdAt]
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        parentCommentId: { type: string, format: uuid }
        authorAccountId: { type: string, format: uuid }
        authorName: { type: string }
        authorKind: { $ref: '#/components/schemas/CommentAuthorKind' }
        body: { type: string }
        edited: { type: boolean }
        deleted: { type: boolean }
        editedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/CommentMention' }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/CommentReactionTally' }
        replies:
          type: array
          items: { $ref: '#/components/schemas/IssueComment' }
        createdAt: { type: string, format: date-time }

    CommentAuthorKind:
      type: string
      enum: [person, agent, integration]

    CommentReaction:
      type: string
      enum: [up, down, celebrate, thinking, eyes, heart]

    CommentReactionTally:
      type: object
      required: [reaction, accountIds]
      properties:
        reaction: { $ref: '#/components/schemas/CommentReaction' }
        accountIds:
          type: array
          items: { type: string, format: uuid }

    CommentMentionKind:
      type: string
      enum: [account, team]

    CommentMention:
      type: object
      required: [kind, name, notified]
      properties:
        kind: { $ref: '#/components/schemas/CommentMentionKind' }
        accountId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        name: { type: string }
        notified: { type: boolean }

    MentionTarget:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/CommentMentionKind' }
        accountId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }

    PostCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }
        parentCommentId: { type: string, format: uuid }
        attachmentIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        mentions:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MentionTarget' }

    EditCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }

    PostedComment:
      type: object
      required: [comment, unreachable]
      properties:
        comment: { $ref: '#/components/schemas/IssueComment' }
        unreachable:
          type: array
          items: { $ref: '#/components/schemas/CommentMention' }

    CommentConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - comment_deleted
                - comment_not_replyable

    RunnerStatus:
      type: string
      enum: [active, revoked]

    RunnerHost:
      type: object
      required: [hostname, os, arch, version]
      properties:
        hostname: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 64 }
        arch: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 64 }

    Runner:
      type: object
      required: [id, workspaceId, agentId, agentName, name, host, status, enrolledAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName:
          type: string
          maxLength: 200
          description: The agent this machine acts as, so a runner can name it without a second call
        name: { type: string, maxLength: 200 }
        host: { $ref: '#/components/schemas/RunnerHost' }
        status: { $ref: '#/components/schemas/RunnerStatus' }
        enrolledAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        pausedAt:
          type: string
          format: date-time
          description: Set while an administrator has stopped this machine being offered work
        revokedAt: { type: string, format: date-time }
        telemetry:
          allOf:
            - $ref: '#/components/schemas/TelemetryMode'
          description: >-
            How much of a run this machine's workspace keeps. On minimal the server declines full
            transcripts, so a machine reads this to send summaries instead of having them refused.
        load:
          allOf:
            - $ref: '#/components/schemas/RunnerLoad'
          description: >-
            What this machine last said about itself. Absent shape until it is connected, because
            capacity is the machine's own count and nothing else knows it.

    RunnerLoad:
      type: object
      description: >-
        How much room a machine has. The machine is the authority on its own slots, so these are
        the figures it reported on its last heartbeat rather than anything norn counted.
      required: [connected, capacity, used, free, diskPressure]
      properties:
        connected:
          type: boolean
          description: Whether the machine is holding a channel right now
        capacity: { type: integer, format: int32 }
        used: { type: integer, format: int32 }
        free: { type: integer, format: int32 }
        diskPressure: { type: boolean }

    EnrolRunnerRequest:
      type: object
      required: [publicKey, host]
      properties:
        name:
          type: string
          maxLength: 200
          description: What to call this machine. Defaults to its hostname.
        publicKey:
          type: string
          description: The machine's Ed25519 public key, 32 bytes in standard base64
        host: { $ref: '#/components/schemas/RunnerHost' }

    EnrolledRunner:
      type: object
      required: [runner, refreshToken]
      properties:
        runner: { $ref: '#/components/schemas/Runner' }
        refreshToken:
          type: string
          description: >-
            Carried once and never returned again. It belongs in the OS keystore beside the
            device private key, not in a file.

    ExchangeRunnerTokenRequest:
      type: object
      required: [refreshToken, runnerId, nonce, issuedAt, audience, signature]
      properties:
        refreshToken: { type: string }
        runnerId: { type: string, format: uuid }
        nonce: { type: string, minLength: 16, maxLength: 128 }
        issuedAt: { type: string, format: date-time }
        audience: { type: string }
        signature:
          type: string
          description: Standard base64 of the Ed25519 signature over the assertion

    RunnerSession:
      type: object
      required: [runner, accessToken, expiresIn, ticket, ticketExpiresIn]
      properties:
        runner: { $ref: '#/components/schemas/Runner' }
        accessToken: { type: string }
        expiresIn:
          type: integer
          format: int32
          description: Seconds the access token stays usable
        ticket:
          type: string
          description: Single use, spent when opening the runner channel
        ticketExpiresIn: { type: integer, format: int32 }
        tunnelTicket:
          type: string
          description: >-
            Single use, spent when opening the preview tunnel. Separate from the channel ticket so
            neither one opens the other's door. Empty when this server serves no preview domain.
        tunnelTicketExpiresIn: { type: integer, format: int32 }
        previewGateway:
          type: string
          maxLength: 512
          description: >-
            Where the machine opens its preview tunnel. Empty when this server serves no preview
            domain, and a machine that reads it empty knows not to try.
        previewDomain:
          type: string
          maxLength: 255
          description: >-
            The domain preview addresses are composed under, so the machine can say where a preview
            reaches rather than only naming its own loopback port.
        previewScheme:
          type: string
          enum: [http, https]
          description: The scheme those addresses carry.

    CodebaseState:
      type: string
      enum: [active, drift, disconnected]

    CodebaseRuntime:
      type: string
      enum: [process, docker, kvm]

    GatewayReach:
      type: string
      description: >-
        Whether this machine can open a preview tunnel. unconfigured means this server serves no
        preview domain, so there was nothing to reach and nothing is wrong.
      enum: [reachable, unreachable, unconfigured]

    RemoteFingerprint:
      type: object
      description: >-
        What a repository's remote is, without saying where it is. The hash identifies the remote
        well enough to recognise the same one on another machine; the host and path tail are for a
        person reading the screen. The full URL never leaves the machine.
      properties:
        hash: { type: string, maxLength: 128 }
        host: { type: string, maxLength: 255 }
        pathTail: { type: string, maxLength: 255 }

    CodebaseRepository:
      type: object
      required: [name, relPath]
      properties:
        name: { type: string, maxLength: 200 }
        relPath:
          type: string
          maxLength: 1024
          description: Where the repository sits inside the connected folder
        defaultBranch: { type: string, maxLength: 255 }
        remote: { $ref: '#/components/schemas/RemoteFingerprint' }

    CodingTool:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 64 }

    Codebase:
      type: object
      required: [id, runnerId, workspaceId, agentId, name, rootPath, state, repositories, sharedFiles, runtimes, tools, connectedAt]
      properties:
        id: { type: string, format: uuid }
        runnerId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        rootPath: { type: string, maxLength: 1024 }
        state: { $ref: '#/components/schemas/CodebaseState' }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/CodebaseRepository' }
        sharedFiles:
          type: array
          description: Instruction and configuration files found at the root, by name
          items: { type: string, maxLength: 255 }
        runtimes:
          type: array
          items: { $ref: '#/components/schemas/CodebaseRuntime' }
        tools:
          type: array
          description: Coding agents installed on the machine, with the versions detected
          items: { $ref: '#/components/schemas/CodingTool' }
        previewGateway: { $ref: '#/components/schemas/GatewayReach' }
        connectedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        disconnectedAt: { type: string, format: date-time }

    ConnectCodebaseRequest:
      type: object
      required: [rootPath]
      properties:
        name:
          type: string
          maxLength: 200
          description: What to call this folder. Defaults to its root path.
        rootPath: { type: string, maxLength: 1024 }
        repositories:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CodebaseRepository' }
        sharedFiles:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 255 }
        runtimes:
          type: array
          items: { $ref: '#/components/schemas/CodebaseRuntime' }
        tools:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/CodingTool' }
        previewGateway: { $ref: '#/components/schemas/GatewayReach' }

    ExecutionState:
      type: string
      enum:
        - queued
        - leased
        - preparing
        - running
        - waiting_for_input
        - queued_for_resume
        - finalizing
        - awaiting_review
        - approved
        - completed
        - failed
        - cancelled
        - interrupted

    ExecutionEventKind:
      type: string
      enum: [transition, phase, command, tool, service, preview, question, note]

    ExecutionQueuedReason:
      type: string
      description: >-
        Why a queued run has not started. The three the delegate dialog has to phrase differently
        are an agent with no machine at all, machines that are all offline, and machines that are
        all busy.
      enum: [no_runner, runners_offline, runners_paused, runners_busy]

    ExecutionParams:
      type: object
      description: How this run was asked for. What is not set is the machine's own default.
      properties:
        tool: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        runtime: { $ref: '#/components/schemas/CodebaseRuntime' }
        baseRef: { $ref: '#/components/schemas/BaseRefPolicy' }
        includeDirty: { type: boolean }
        permissionProfile: { $ref: '#/components/schemas/PermissionProfile' }
        brief: { type: string, maxLength: 4000 }

    ExecutionActor:
      type: object
      description: Who caused an entry. A machine reports as the agent it is bound to.
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ActivityActorKind' }
        accountId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        runnerId: { type: string, format: uuid }

    Execution:
      type: object
      required: [id, reference, workspaceId, issueId, issueReference, attempt, state, params, queuedAt]
      properties:
        id: { type: string, maxLength: 64 }
        reference:
          type: string
          description: The issue reference, suffixed with the attempt from the second run on
        workspaceId: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        issueReference: { type: string }
        issueTitle:
          type: string
          description: The issue this run was taken from, named here so a list of runs reads
        teamId: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        runnerId: { type: string, format: uuid }
        runnerName:
          type: string
          maxLength: 200
          description: >-
            The machine that took this run, named here so watching a run needs no right to list
            every machine in the workspace.
        codebaseId: { type: string, format: uuid }
        codebaseName:
          type: string
          maxLength: 200
          description: The folder the run was taken from, named for the same reason
        attempt: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ExecutionState' }
        reason: { type: string, maxLength: 4000 }
        queuedReason:
          allOf:
            - $ref: '#/components/schemas/ExecutionQueuedReason'
          description: Why this run is still waiting. Absent once a machine has taken it.
        params: { $ref: '#/components/schemas/ExecutionParams' }
        restartable:
          type: boolean
          description: Whether this run can be offered again as a fresh attempt
        leaseExpiresAt: { type: string, format: date-time }
        keepUntil:
          type: string
          format: date-time
          description: >-
            When the machine gives this run's workspace and previews back. The machine owns the
            clock, so this is what it reported. Absent while it is still holding them for a
            decision, and in the past once they are gone.
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    ExecutionEvent:
      type: object
      required: [id, executionId, sequence, kind, actor, occurredAt]
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string, maxLength: 64 }
        sequence:
          type: integer
          format: int64
          description: Pass the last one back as after to read on from here
        kind: { $ref: '#/components/schemas/ExecutionEventKind' }
        fromState: { $ref: '#/components/schemas/ExecutionState' }
        toState: { $ref: '#/components/schemas/ExecutionState' }
        actor: { $ref: '#/components/schemas/ExecutionActor' }
        reason: { type: string }
        detail:
          type: object
          additionalProperties: true
          description: Whatever the machine attached to this entry
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    ExecutionDetail:
      type: object
      required: [execution, timeline]
      properties:
        execution: { $ref: '#/components/schemas/Execution' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/ExecutionEvent' }
        changeset:
          allOf:
            - $ref: '#/components/schemas/ExecutionChangeSet'
          description: >-
            What this run changed. Absent until the machine has reported anything.
        previews:
          type: array
          items: { $ref: '#/components/schemas/ExecutionPreview' }
        services:
          type: array
          items: { $ref: '#/components/schemas/ExecutionService' }
        runner:
          allOf:
            - $ref: '#/components/schemas/ExecutionRunner'
          description: >-
            The machine holding this run and how much room it has. Absent while no machine has
            taken it.

    ExecutionChangeSummary:
      type: object
      description: What one run changed, totalled across every repository it touched.
      required: [repositories, commits, additions, deletions, filesChanged, pullRequests]
      properties:
        repositories: { type: integer, minimum: 0 }
        commits: { type: integer, minimum: 0 }
        additions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        filesChanged: { type: integer, minimum: 0 }
        pullRequests: { type: integer, minimum: 0 }

    ExecutionSummary:
      type: object
      required: [execution, change]
      properties:
        execution: { $ref: '#/components/schemas/Execution' }
        change: { $ref: '#/components/schemas/ExecutionChangeSummary' }

    ExecutionRunner:
      type: object
      required: [id, name, load]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        pausedAt: { type: string, format: date-time }
        load: { $ref: '#/components/schemas/RunnerLoad' }

    ExecutionServiceState:
      type: string
      description: >-
        A service with no probe is not healthy the moment it is spawned; it is healthy once it has
        stayed up long enough to be checked.
      enum: [starting, healthy, unhealthy, stopped]

    ExecutionServiceProbe:
      type: string
      description: How the machine checks this service. Empty when nothing checks it.
      enum: ['', http, tcp, log]

    ExecutionService:
      type: object
      required: [id, executionId, name, state, probe, port, reportedAt]
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 32 }
        state: { $ref: '#/components/schemas/ExecutionServiceState' }
        probe: { $ref: '#/components/schemas/ExecutionServiceProbe' }
        port:
          type: integer
          format: int32
          description: >-
            The port this run reserved for the service. Held by the run rather than the process, so
            it survives a restart. Zero while nothing has been reserved.
        reason:
          type: string
          maxLength: 1000
          description: Why the service is in this state, in the machine's own words
        reportedAt: { type: string, format: date-time }

    ExecutionPreview:
      type: object
      required: [id, executionId, name, service, mode, state, url, openedAt]
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string }
        name: { type: string }
        service: { type: string }
        path: { type: string }
        mode: { type: string, enum: [subdomain, path] }
        host: { type: string }
        url:
          type: string
          description: >-
            Empty while this server serves no preview domain, because there is then no address
            that reaches anybody.
        state: { type: string, enum: [open, closed] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }

    ExecutionPreviewDetail:
      type: object
      required: [preview, shareLinks]
      properties:
        preview: { $ref: '#/components/schemas/ExecutionPreview' }
        shareLinks:
          type: array
          items: { $ref: '#/components/schemas/PreviewShareLink' }

    PreviewShareLink:
      type: object
      required: [id, previewId, expiresAt, needsPasscode, uses, createdAt]
      properties:
        id: { type: string, format: uuid }
        previewId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        needsPasscode: { type: boolean }
        uses: { type: integer }
        createdAt: { type: string, format: date-time }

    PreviewShareLinkMinted:
      type: object
      required: [link, url]
      properties:
        link: { $ref: '#/components/schemas/PreviewShareLink' }
        url:
          type: string
          description: The only time norn answers with this address. It keeps only the hash.

    SharePreviewRequest:
      type: object
      properties:
        lifetimeSeconds:
          type: integer
          minimum: 60
          description: How long the link lives. Left out, it lives for the instance default.
        passcode:
          type: string
          minLength: 6
          maxLength: 128

    RetainExecutionRequest:
      type: object
      required: [longerSeconds]
      properties:
        longerSeconds:
          type: integer
          minimum: 60
          description: How much longer the machine holds this run's workspace and previews.

    ValidationStatus:
      type: string
      enum: [passed, failed, skipped]

    ExecutionRepositoryChange:
      type: object
      description: >-
        One repository this run touched. The pull request is carried as the address the machine
        reported plus, when norn follows that repository, the code link whose state, checks and
        reviewers stay current on their own.
      required: [repository, commits, additions, deletions, filesChanged, reportedAt]
      properties:
        repository: { type: string, maxLength: 200 }
        branch: { type: string, maxLength: 255 }
        baseSha: { type: string, maxLength: 64 }
        headSha: { type: string, maxLength: 64 }
        commits: { type: integer, minimum: 0 }
        additions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        filesChanged: { type: integer, minimum: 0 }
        diffArtifactId:
          type: string
          format: uuid
          description: The full diff, uploaded as an artifact of this run
        pullRequestUrl: { type: string, maxLength: 2000 }
        codeLinkId:
          type: string
          format: uuid
          description: >-
            The code link this pull request became. Absent when norn does not follow the
            repository, in which case the address is all there is.
        reportedAt: { type: string, format: date-time }

    ExecutionValidation:
      type: object
      required: [check, status, reportedAt]
      properties:
        check: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/ValidationStatus' }
        detail: { type: string, maxLength: 4000 }
        artifactId: { type: string, format: uuid }
        reportedAt: { type: string, format: date-time }

    ExecutionChangeSet:
      type: object
      description: >-
        What one run changed. Built up as the work lands and settled when the run reports its
        result.
      required: [executionId, repositories, validation]
      properties:
        executionId: { type: string, maxLength: 64 }
        summary:
          type: string
          maxLength: 16000
          description: What the machine said it did. Empty until the run reports its result.
        reportedAt: { type: string, format: date-time }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/ExecutionRepositoryChange' }
        validation:
          type: array
          items: { $ref: '#/components/schemas/ExecutionValidation' }

    IssueRepositoryChange:
      allOf:
        - $ref: '#/components/schemas/ExecutionRepositoryChange'
        - type: object
          required: [executionId, attempt]
          properties:
            executionId: { type: string, maxLength: 64 }
            attempt:
              type: integer
              minimum: 1
              description: Which run of this issue this repository's state came from

    IssueChangeSet:
      type: object
      required: [issueId, repositories]
      properties:
        issueId: { type: string, format: uuid }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/IssueRepositoryChange' }

    CancelExecutionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }

    ResumeExecutionRequest:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: string
          minLength: 1
          maxLength: 4000
          description: Handed to the coding agent verbatim

    ExecutionStream:
      type: string
      enum: [logs, transcript]

    TelemetryMode:
      type: string
      enum: [full, minimal]

    ExecutionLogEntry:
      type: object
      required: [text]
      properties:
        at:
          type: string
          format: date-time
          description: When the line was written. Defaults to when the server received the batch.
        stream: { type: string, maxLength: 64, description: Which handle it came out of }
        source: { type: string, maxLength: 128, description: The service or step that wrote it }
        text: { type: string }

    ExecutionTranscriptEntry:
      type: object
      required: [type]
      properties:
        at: { type: string, format: date-time }
        type:
          type: string
          maxLength: 64
          description: The normalised event kind, such as message, tool_call, tool_result or usage
        payload:
          type: object
          additionalProperties: true
          description: Whatever the driver put in the event

    UploadExecutionLogsRequest:
      type: object
      required: [sequence, entries]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Where this batch sits in the stream. A position may be filled once.
        entries:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/ExecutionLogEntry' }

    UploadExecutionTranscriptRequest:
      type: object
      required: [sequence, entries]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Where this chunk sits in the stream. A position may be filled once.
        entries:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/ExecutionTranscriptEntry' }

    ExecutionChunkReceipt:
      type: object
      required: [stream, sequence, digest, entryCount, bytes, duplicate, receivedAt]
      properties:
        stream: { $ref: '#/components/schemas/ExecutionStream' }
        sequence: { type: integer, format: int64 }
        digest:
          type: string
          description: The server's own digest of what it stored, and what makes a replay a no-op
        entryCount: { type: integer }
        bytes: { type: integer, format: int64, description: What the batch takes in storage }
        duplicate:
          type: boolean
          description: True when this batch was already held, so nothing was stored a second time
        receivedAt: { type: string, format: date-time }

    ExecutionStreamCursor:
      type: object
      required: [stream, lastSequence, chunks, entryCount, bytes]
      properties:
        stream: { $ref: '#/components/schemas/ExecutionStream' }
        lastSequence: { type: integer, format: int64 }
        chunks: { type: integer }
        entryCount: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }

    ExecutionChunk:
      type: object
      required: [stream, sequence, digest, entryCount, bytes, firstAt, lastAt, receivedAt]
      properties:
        stream: { $ref: '#/components/schemas/ExecutionStream' }
        sequence: { type: integer, format: int64 }
        digest: { type: string }
        entryCount: { type: integer }
        bytes: { type: integer, format: int64 }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }

    ExecutionLogChunk:
      allOf:
        - $ref: '#/components/schemas/ExecutionChunk'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/ExecutionLogEntry' }

    ExecutionTranscriptChunk:
      allOf:
        - $ref: '#/components/schemas/ExecutionChunk'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/ExecutionTranscriptEntry' }

    ExecutionArtifact:
      type: object
      required: [id, executionId, name, contentType, bytes, digest, createdAt]
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        contentType: { type: string, maxLength: 128 }
        bytes: { type: integer, format: int64 }
        digest: { type: string }
        createdAt: { type: string, format: date-time }

    ExecutionArtifactReceipt:
      allOf:
        - $ref: '#/components/schemas/ExecutionArtifact'
        - type: object
          required: [duplicate]
          properties:
            duplicate:
              type: boolean
              description: True when this file was already published, so the first id is returned

