        '201':
          description: The agent and its new credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredAgent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/AgentUnusable' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agents/{agentId}/activity:
    get:
      tags: [agents]
      operationId: listWorkspaceAgentActivity
      summary: Everything this agent has done, across every issue and project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AgentId'
