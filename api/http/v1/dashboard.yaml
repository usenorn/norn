        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [states]
      operationId: removeWorkflowState
      summary: Remove a state, moving every issue in it to another state
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/StateId'
        - name: replacementStateId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The state was removed and its issues moved
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
