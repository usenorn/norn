        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/triage/{issueId}/reassign:
    post:
      tags: [triage]
      operationId: reassignWorkspaceTriageIssue
      summary: Hand an issue to another team to decide about
      description: >-
        The issue keeps waiting, in the other team's queue. If that team does not triage, it goes
