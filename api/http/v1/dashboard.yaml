      tags: [triage]
      operationId: acceptWorkspaceTriageIssue
      summary: Let an issue through into the team's backlog
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The issue, now part of the team's work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/triage/{issueId}/decline:
    post:
      tags: [triage]
