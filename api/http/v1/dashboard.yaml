      required: [workspace, email, role, invitedAt, expiresAt, accountExists, ssoEnforced, teams]
      properties:
        workspace: { $ref: '#/components/schemas/InvitationWorkspace' }
        email: { type: string }
        role: { $ref: '#/components/schemas/MembershipRole' }
        invitedBy: { $ref: '#/components/schemas/InvitationInviter' }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        accountExists: { type: boolean }
        ssoEnforced: { type: boolean }
        teams:
          type: array
          description: The teams this invitation puts the person on
          items: { type: string }

    InvitationInviter:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }

    InvitationWorkspace:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        password: { type: string }

    AcceptedInvitation:
      type: object
      required: [workspace, membership]
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        membership: { $ref: '#/components/schemas/Membership' }
        slot:
          type: string
          description: >-
            Present when accepting also signed the person in. Name it to act as the account that
            joined, which a browser already holding other sessions has no other way to know.

    ConfirmedSignUp:
      type: object
      required: [account, slot]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        slot:
          type: string
          description: >-
            The session this call issued. Name it to act as the account the link created.

    NotificationPage:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread: { type: integer, format: int32 }
        nextCursor: { type: string }

    Notification:
      type: object
      required: [subjectKind, subjectId, kind, reason, actorKind, title, unreadCount, lastEventAt]
      properties:
        subjectKind: { $ref: '#/components/schemas/NotificationSubjectKind' }
        subjectId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        reason: { $ref: '#/components/schemas/NotificationReason' }
        actorAccountId: { type: string, format: uuid }
        actorName: { type: string }
        actorKind: { $ref: '#/components/schemas/NotificationActorKind' }
        title: { type: string }
        reference: { type: string }
        teamKey: { type: string }
        projectSlug: { type: string }
        unreadCount: { type: integer, format: int32 }
        lastEventAt: { type: string, format: date-time }
        snoozedUntil: { type: string, format: date-time }

    NotificationSubjectKind:
      type: string
      enum: [issue, project, team]

    NotificationKind:
      type: string
      enum: [assigned, mentioned, commented, state_changed, membership, approval_waiting]

    NotificationReason:
      type: string
      enum: [mentioned, approval, assigned, membership, following]

    NotificationActorKind:
      type: string
      enum: [user, token, agent, system]

    SnoozeNotificationRequest:
      type: object
      required: [until]
      properties:
        until: { type: string, format: date-time }

    IssueFollowerList:
      type: object
      required: [followers]
      properties:
        followers:
          type: array
          items: { $ref: '#/components/schemas/IssueFollower' }

    IssueFollower:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }

    IssueFollow:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/FollowState' }

    FollowState:
      type: string
      enum: [following, muted]

    NotificationSettings:
      type: object
      required: [preferences, workspace, overridden]
      properties:
        preferences: { $ref: '#/components/schemas/NotificationPreferences' }
        workspace: { $ref: '#/components/schemas/NotificationPreferences' }
        overridden: { type: boolean }

    NotificationPreferences:
      type: object
      required: [assigned, mentioned, commented, stateChanged, membership, approvals, agents]
      properties:
        assigned: { $ref: '#/components/schemas/NotificationChannels' }
        mentioned: { $ref: '#/components/schemas/NotificationChannels' }
        commented: { $ref: '#/components/schemas/NotificationChannels' }
        stateChanged: { $ref: '#/components/schemas/NotificationChannels' }
        membership: { $ref: '#/components/schemas/NotificationChannels' }
        approvals:
          $ref: '#/components/schemas/NotificationChannels'
          description: An agent is waiting for you to approve something before it can carry on.
        agents: { $ref: '#/components/schemas/NotificationChannels' }

    NotificationChannels:
      type: object
      required: [inbox, email]
      properties:
        inbox: { type: boolean }
        email: { type: boolean }

    SearchResults:
      type: object
      required: [query, groups, fuzzy]
      properties:
        query: { type: string }
        fuzzy: { type: boolean }
        groups:
          type: array
          items: { $ref: '#/components/schemas/SearchGroup' }

    SearchGroup:
      type: object
      required: [kind, results, more]
      properties:
        kind: { $ref: '#/components/schemas/SearchKind' }
        more: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }

    SearchResult:
      type: object
      required: [kind, id, title, titleHit, updatedAt]
      properties:
        kind: { $ref: '#/components/schemas/SearchKind' }
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        reference: { type: string }
        teamKey: { type: string }
        slug: { type: string }
        status: { type: string }
        titleHit: { type: boolean }
        updatedAt: { type: string, format: date-time }

    SearchKind:
      type: string
      enum: [issue, comment, project, team, person]
