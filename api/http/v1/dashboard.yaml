    get:
      tags: [labels]
      operationId: listWorkspaceLabels
      summary: List the labels this actor can see, workspace-wide and team-scoped
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The labels, ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [labels]
      operationId: createWorkspaceLabel
      summary: Define a label for the workspace or for a single team
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLabelRequest' }
      responses:
        '201':
          description: The label that was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/labels/{labelId}:
    patch:
      tags: [labels]
      operationId: updateWorkspaceLabel
      summary: Rename a label, recolour it, or move it between groups
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLabelRequest' }
      responses:
        '200':
          description: The updated label, with the same id it has always had
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [labels]
      operationId: removeWorkspaceLabel
      summary: Remove a label, acknowledging how many issues carry it
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
        - name: acknowledgedIssues
          in: query
          required: true
          description: The number of issues the caller was told this label is on
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '204': { description: The label was removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/labels/{labelId}/usage:
    get:
      tags: [labels]
      operationId: getWorkspaceLabelUsage
      summary: How many issues carry this label, within the actor's scope
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: The number of issues carrying the label
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelUsage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/labels/{labelId}/merge:
    post:
      tags: [labels]
      operationId: mergeWorkspaceLabel
      summary: Merge this label into another, moving every application
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeLabelRequest' }
      responses:
        '200':
          description: The surviving label
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/label-groups:
    get:
      tags: [labels]
      operationId: listWorkspaceLabelGroups
      summary: List the workspace's label groups
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The label groups, ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LabelGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [labels]
      operationId: createWorkspaceLabelGroup
      summary: Create a group whose labels are mutually exclusive on an issue
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelGroupRequest' }
      responses:
        '201':
          description: The group that was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/label-groups/{groupId}:
    patch:
      tags: [labels]
      operationId: renameWorkspaceLabelGroup
      summary: Rename a label group
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelGroupRequest' }
      responses:
        '200':
          description: The renamed group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/LabelConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [labels]
      operationId: removeWorkspaceLabelGroup
      summary: Remove a group, releasing its labels rather than deleting them
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204': { description: The group was removed and its labels released }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/status:
    post:
      tags: [issues]
      operationId: setWorkspaceIssueStatus
      summary: Archive, delete or restore an issue without losing its reference
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetIssueStatusRequest' }
      responses:
        '200':
          description: The issue as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/relations:
    get:
      tags: [issues]
      operationId: listWorkspaceIssueRelations
      summary: List an issue's relations, grouped by what each one means
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The relations the caller may see, grouped by kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueRelationGroups' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [issues]
      operationId: addWorkspaceIssueRelation
      summary: Link two issues, recording the inverse on the other one automatically
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddIssueRelationRequest' }
      responses:
        '201':
          description: The relation as seen from this issue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueRelation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/relations/{relationId}:
    delete:
      tags: [issues]
      operationId: removeWorkspaceIssueRelation
      summary: Unlink two issues, from either side, removing both directions
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
        - name: relationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The relation was removed from both issues
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/team:
    post:
      tags: [issues]
      operationId: moveWorkspaceIssueToTeam
      summary: Move an issue to another team, keeping its reference and remapping its state
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveIssueRequest' }
      responses:
        '200':
          description: The issue on its new team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/parent:
    post:
      tags: [issues]
      operationId: setWorkspaceIssueParent
      summary: File an issue under another, or detach it, moving its sub-tree with it
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetIssueParentRequest' }
      responses:
        '200':
          description: The issue as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/children:
    get:
      tags: [issues]
      operationId: listWorkspaceIssueChildren
      summary: List an issue's children and how far through them the work is
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The children the caller may see, and their per-category tallies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueChildren' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/labels:
    put:
      tags: [issues]
      operationId: setWorkspaceIssueLabels
      summary: Replace the labels on an issue with the given set
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetIssueLabelsRequest' }
      responses:
        '200':
          description: The labels the issue now carries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: norn_session

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StateId:
      name: stateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LabelId:
      name: labelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: A problem occurred
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TeamConflict:
      description: The key is taken, or the team or workspace refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TeamConflictProblem' }

    MembershipConflict:
      description: The membership refuses the change, or the workspace does
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MembershipConflictProblem' }

    SignInRejected:
      description: The email and password did not match
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvalidCredentialsProblem' }

    AccountLocked:
      description: Consecutive failures locked the account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AccountLockedProblem' }

    TooManyAttempts:
      description: The caller exceeded the attempt limit for its address
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RateLimitedProblem' }

    PasswordResetLinkExpired:
      description: The reset link expired, was superseded, or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkExpiredProblem' }

    PasswordResetLinkUsed:
      description: The reset link was already used
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkUsedProblem' }

    APITokenUnusable:
      description: The token name is taken, or its scopes exceed the caller's rights
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/APITokenUnusableProblem' }

    WorkflowStateConflict:
      description: The state cannot change without leaving the team unusable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkflowStateConflictProblem' }

    IssueConflict:
      description: The issue changed since it was read
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/IssueConflictProblem' }

    LabelConflict:
      description: The label cannot change without losing or duplicating work
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LabelConflictProblem' }

    Forbidden:
      description: The actor may not perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ForbiddenProblem' }

    SignUpUnavailable:
      description: The instance does not create accounts from the sign-up form
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpClosedProblem' }

    SignUpLinkExpired:
      description: The sign-up link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpExpiredProblem' }

    SignUpLinkUnusable:
      description: The link was already used, or an account already has the address
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpUnusableProblem' }

    MailUnavailable:
      description: The instance is not configured to send mail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MailUnavailableProblem' }

    BreachCheckUnavailable:
      description: The password breach check could not be completed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BreachCheckUnavailableProblem' }

    InvitationLinkExpired:
      description: The invitation link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationExpiredProblem' }

    InvitationLinkUnusable:
      description: The invitation was revoked, already accepted, or addressed to someone else
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationUnusableProblem' }

    WorkspaceDeleted:
      description: The workspace is pending deletion and accepts nothing but restore
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkspaceDeletedProblem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }

    InvalidCredentialsProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, attemptsLeft]
          properties:
            code: { type: string, enum: [invalid_credentials] }
            attemptsLeft: { type: integer, format: int32, minimum: 0 }

    AccountLockedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, unlocksAt]
          properties:
            code: { type: string, enum: [account_locked] }
            unlocksAt: { type: string, format: date-time }

    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [rate_limited] }

    ResetLinkExpiredProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_expired] }

    ResetLinkUsedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_used] }

    LabelColor:
      type: string
      enum: [neutral, cyan, blue, violet, orchid, magenta]

    Label:
      type: object
      required: [id, workspaceId, name, color]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }

    LabelGroup:
      type: object
      required: [id, workspaceId, name]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }

    LabelUsage:
      type: object
      required: [issues]
      properties:
        issues: { type: integer, format: int32 }

    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }

    IssueStatus:
      type: string
      enum: [active, archived, pending_deletion]

    SetIssueStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/IssueStatus' }
        expectedVersion: { type: integer, format: int32 }

    BulkOutcome:
      type: string
      enum: [applied, unchanged, forbidden, not_found, conflict, invalid]

    BulkActionStatus:
      type: string
      enum: [queued, running, complete, failed]

    BulkChange:
      type: object
      description: Exactly one lifecycle change, or any combination of property changes
      properties:
        stateId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        clearAssignee: { type: boolean }
        addLabelId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        status: { $ref: '#/components/schemas/IssueStatus' }

    BulkFilter:
      type: object
      description: The set is resolved when the action runs, with the caller's own visibility
      properties:
        teamId: { type: string, format: uuid }
        status:
          type: array
          items: { $ref: '#/components/schemas/IssueStatus' }

    BulkChangeRequest:
      type: object
      required: [change]
      properties:
        change: { $ref: '#/components/schemas/BulkChange' }
        issueIds:
          type: array
          items: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/BulkFilter' }

    BulkActionOutcome:
      type: object
      required: [issueId, reference, outcome]
      properties:
        issueId: { type: string, format: uuid }
        reference: { type: string }
        outcome: { $ref: '#/components/schemas/BulkOutcome' }

    BulkActionResult:
      type: object
      required: [id, status, processed, outcomes]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BulkActionStatus' }
        processed: { type: integer, format: int32 }
        expected:
          type: integer
          format: int32
          nullable: true
