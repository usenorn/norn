openapi: 3.0.3
info:
  title: Norn Dashboard API
  version: 1.0.0
servers:
  - url: /v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: health
  - name: instance
  - name: auth
  - name: accounts
  - name: sessions
  - name: workspaces
  - name: teams
  - name: invitations
  - name: issues
  - name: states
  - name: tokens

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Report service liveness
      security: []
      responses:
        '200':
          description: The service is reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /instance:
    get:
      tags: [instance]
      operationId: getInstance
      summary: Describe what this instance offers before anyone signs in
      security: []
      responses:
        '200':
          description: The public instance configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/sign-up:
    post:
      tags: [auth]
      operationId: requestSignUp
      summary: Hold a pending sign-up and send its one-time verification link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestSignUpRequest' }
      responses:
        '202':
          description: The address must be confirmed before the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignUpRequested' }
        '403': { $ref: '#/components/responses/SignUpUnavailable' }
        '409': { $ref: '#/components/responses/SignUpLinkUnusable' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/sign-up/confirm:
    post:
      tags: [auth]
      operationId: confirmSignUp
      summary: Create the account behind a verified sign-up and sign the person in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmSignUpRequest' }
      responses:
        '200':
          description: The account the link created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/SignUpLinkExpired' }
        '409': { $ref: '#/components/responses/SignUpLinkUnusable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [auth]
      operationId: signIn
      summary: Exchange credentials for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '204':
          description: A session cookie was issued
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/SignInRejected' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a single-use password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
      responses:
        '202':
          description: A link was sent if the address has an account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequested' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/MailUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed token, ending every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '204':
          description: The password was replaced and every session ended
          headers:
            Set-Cookie:
              schema: { type: string }
        '400': { $ref: '#/components/responses/PasswordResetLinkExpired' }
        '409': { $ref: '#/components/responses/PasswordResetLinkUsed' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: Discard the current session
      responses:
        '204':
          description: The session was discarded
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me:
    get:
      tags: [accounts]
      operationId: getCurrentAccount
      summary: Read the signed-in account
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [accounts]
      operationId: updateCurrentAccount
      summary: Update display name and timezone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [accounts]
      operationId: deleteCurrentAccount
      summary: Delete the account and anonymize its authored content
      responses:
        '204':
          description: The account was anonymized
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/deactivate:
    post:
      tags: [accounts]
      operationId: deactivateCurrentAccount
      summary: Deactivate the account while preserving its authored content
      responses:
        '200':
          description: The deactivated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/password:
    post:
      tags: [accounts]
      operationId: setPassword
      summary: Establish a password for an account created without one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204':
          description: The password was established and the session was rotated
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [accounts]
      operationId: changePassword
      summary: Replace the current password, revoking every other session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: The password was replaced and the session was rotated
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/email-change:
    get:
      tags: [accounts]
      operationId: getPendingEmailChange
      summary: Read the pending email change, if any
      responses:
        '200':
          description: The pending email change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [accounts]
      operationId: requestEmailChange
      summary: Request a new address, which stays pending until confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEmailChangeRequest' }
      responses:
        '202':
          description: The change is pending confirmation of the new address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/email-change/confirm:
    post:
      tags: [accounts]
      operationId: confirmEmailChange
      summary: Confirm a pending email change with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailChangeRequest' }
      responses:
        '200':
          description: The account now uses the confirmed address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/avatar:
    put:
      tags: [accounts]
      operationId: uploadAvatar
      summary: Replace the account avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The account with its new avatar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [accounts]
      operationId: removeAvatar
      summary: Remove the account avatar
      responses:
        '200':
          description: The account without an avatar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List the signed-in account's active sessions
      responses:
        '200':
          description: The account's active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sessions]
      operationId: revokeAllSessions
      summary: Revoke every session for the account, including the current one
      responses:
        '204':
          description: Every session was revoked
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Revoke a single session immediately
      responses:
        '204':
          description: The session was revoked
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/auth-policy:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspaceAuthPolicy
      summary: Read which authentication methods the workspace accepts
      responses:
        '200':
          description: The workspace authentication policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAuthPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [workspaces]
      operationId: setWorkspaceAuthPolicy
      summary: Set which authentication methods the workspace accepts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceAuthPolicyRequest' }
      responses:
        '200':
          description: The updated workspace authentication policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAuthPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: List the workspaces the signed-in account belongs to
      responses:
        '200':
          description: The workspaces held by the account
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace with the signed-in account as its administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: The created workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Read a workspace the signed-in account belongs to
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Change the workspace display name and timezone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: The updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceDeleted' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete the workspace into a recoverable state
      responses:
        '200':
          description: The workspace, now pending deletion until its purge date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceDeleted' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workspaces]
      operationId: restoreWorkspace
      summary: Recover a workspace before its purge date passes
      responses:
        '200':
          description: The restored workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: List workspace members, searchable and paged by cursor
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of workspace members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [workspaces]
      operationId: addWorkspaceMember
      summary: Add an account to the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: The created membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    patch:
      tags: [workspaces]
      operationId: changeWorkspaceMemberRole
      summary: Change a member role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemberRoleRequest' }
      responses:
        '200':
          description: The updated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member, optionally handing their work to another member
      parameters:
        - name: reassignTo
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The member was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/members/{accountId}/removal:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [workspaces]
      operationId: previewWorkspaceMemberRemoval
      summary: Report what removing this member would affect
      responses:
        '200':
          description: What removing the member would affect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberRemovalPreview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/teams:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [teams]
      operationId: listWorkspaceTeams
      summary: List the teams the signed-in account may see in the workspace
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TeamStatus' }
      responses:
        '200':
          description: The teams visible to the account
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [teams]
      operationId: createWorkspaceTeam
      summary: Create a team with a name and the immutable key its issues carry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: The created team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/TeamConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      operationId: getWorkspaceTeam
      summary: Read a team the signed-in account may see
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [teams]
      operationId: updateWorkspaceTeam
      summary: Change the team display name and visibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamRequest' }
      responses:
        '200':
          description: The updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
