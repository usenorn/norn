    put:
      tags: [triage]
      operationId: setTeamTriageSettings
      summary: Start holding incoming issues for review, or change what is held
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTriageSettingsRequest' }
      responses:
        '200':
          description: The team's triage rules as they now stand
          content:
            application/json:
