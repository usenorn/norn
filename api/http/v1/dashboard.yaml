        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclineTriageIssueRequest' }
      responses:
        '200':
          description: The issue, now closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/triage/{issueId}/merge:
    post:
      tags: [triage]
      operationId: mergeWorkspaceTriageIssue
      summary: Fold an issue into one that already says the same thing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeTriageIssueRequest' }
      responses:
        '200':
          description: The issue, now recorded as a duplicate and closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/triage/{issueId}/reassign:
    post:
      tags: [triage]
      operationId: reassignWorkspaceTriageIssue
      summary: Hand an issue to another team to decide about
      description: >-
        The issue keeps waiting, in the other team's queue. If that team does not triage, it goes
