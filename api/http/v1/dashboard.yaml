      summary: Re-enable an agent and issue a fresh credential with its previous authority
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '201':
          description: The re-enabled agent and its new credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredAgent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/AgentUnusable' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agents/{agentId}/credential:
    post:
      tags: [agents]
      operationId: rotateWorkspaceAgentCredential
      summary: Issue a fresh credential for an agent, revoking the one it had
      description: >-
        The value is shown once and never stored, so a lost credential is replaced rather than
        recovered. The old one stops working the moment this returns, and the agent keeps its
        permissions, its name, and everything it has already done.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AgentId'
