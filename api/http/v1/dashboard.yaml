openapi: 3.0.3
info:
  title: Norn Dashboard API
  version: 1.0.0
servers:
  - url: /v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: health
  - name: instance
  - name: auth
  - name: accounts
  - name: sessions
  - name: workspaces
  - name: teams
  - name: invitations
  - name: issues
  - name: saved-views
  - name: triage
  - name: states
  - name: tokens
  - name: webhooks
  - name: agents
  - name: sso
  - name: notifications
  - name: search
  - name: audit
  - name: directory
  - name: licence
  - name: imports
  - name: source-control
  - name: questions
  - name: runners
  - name: codebases
  - name: executions
  - name: previews

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Report service liveness
      security: []
      responses:
        '200':
          description: The service is reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /instance:
    get:
      tags: [instance]
      operationId: getInstance
      summary: Describe what this instance offers before anyone signs in
      security: []
      responses:
        '200':
          description: The public instance configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/sign-up:
    post:
      tags: [auth]
      operationId: requestSignUp
      summary: Hold a pending sign-up and send its one-time verification link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestSignUpRequest' }
      responses:
        '202':
          description: The address must be confirmed before the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignUpRequested' }
        '403': { $ref: '#/components/responses/SignUpUnavailable' }
        '409': { $ref: '#/components/responses/SignUpLinkUnusable' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/SignUpNotProcessable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/sign-up/confirm:
    post:
      tags: [auth]
      operationId: confirmSignUp
      summary: Create the account behind a verified sign-up and sign the person in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmSignUpRequest' }
      responses:
        '200':
          description: The account the link created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedSignUp' }
        '400': { $ref: '#/components/responses/SignUpLinkExpired' }
        '409': { $ref: '#/components/responses/SignUpLinkUnusable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [auth]
      operationId: signIn
      summary: Answer a password with a code sent to the address it belongs to
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '202':
          description: The password was accepted and a code is on its way
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInChallenge' }
        '401': { $ref: '#/components/responses/SignInRejected' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/login/verify:
    post:
      tags: [auth]
      operationId: verifySignInCode
      summary: Finish a sign-in with the code that was sent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifySignInCodeRequest' }
      responses:
        '200':
          description: A session cookie was issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSession' }
        '401': { $ref: '#/components/responses/SignInCodeRejected' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a single-use password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
      responses:
        '202':
          description: A link was sent if the address has an account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequested' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed token, ending every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '204':
          description: The password was replaced and every session ended
        '400': { $ref: '#/components/responses/PasswordResetLinkExpired' }
        '409': { $ref: '#/components/responses/PasswordResetLinkUsed' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: Discard the current session
      responses:
        '204':
          description: The session was discarded
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /sso/oidc/login:
    post:
      tags: [sso]
      operationId: beginOidcLogin
      summary: Start a single sign-on exchange for a workspace
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginOidcLoginRequest' }
      responses:
        '200':
          description: Send the browser to this address to authenticate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcAuthorization' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /sso/saml/login:
    post:
      tags: [sso]
      operationId: beginSamlLogin
      summary: Start a SAML sign-in for a workspace
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginOidcLoginRequest' }
      responses:
        '200':
          description: Send the browser to this address to authenticate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcAuthorization' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me:
    get:
      tags: [accounts]
      operationId: getCurrentAccount
      summary: Read the signed-in account
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [accounts]
      operationId: updateCurrentAccount
      summary: Update display name and timezone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [accounts]
      operationId: deleteCurrentAccount
      summary: Delete the account and anonymize its authored content
      responses:
        '204':
          description: The account was anonymized
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/deactivate:
    post:
      tags: [accounts]
      operationId: deactivateCurrentAccount
      summary: Deactivate the account while preserving its authored content
      responses:
        '200':
          description: The deactivated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/password:
    post:
      tags: [accounts]
      operationId: setPassword
      summary: Establish a password for an account created without one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204':
          description: The password was established and the session was rotated
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [accounts]
      operationId: changePassword
      summary: Replace the current password, revoking every other session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: The password was replaced and the session was rotated
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/BreachCheckUnavailable' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/email-change:
    get:
      tags: [accounts]
      operationId: getPendingEmailChange
      summary: Read the pending email change, if any
      responses:
        '200':
          description: The pending email change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [accounts]
      operationId: requestEmailChange
      summary: Request a new address, which stays pending until confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEmailChangeRequest' }
      responses:
        '202':
          description: The change is pending confirmation of the new address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/email-change/confirm:
    post:
      tags: [accounts]
      operationId: confirmEmailChange
      summary: Confirm a pending email change with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailChangeRequest' }
      responses:
        '200':
          description: The account now uses the confirmed address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/me/avatar:
    put:
      tags: [accounts]
      operationId: uploadAvatar
      summary: Replace the account avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The account with its new avatar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [accounts]
      operationId: removeAvatar
      summary: Remove the account avatar
      responses:
        '200':
          description: The account without an avatar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /accounts/signed-in:
    get:
      tags: [accounts]
      operationId: listSignedInAccounts
      summary: Every account this browser is signed in to, with the workspaces each one holds
      description: >-
        Answers for every session cookie on the request rather than for one of them, so it needs
        no acting session. A cookie whose session has ended is expired on this response, so the
        browser stops presenting it.
      responses:
        '200':
          description: The accounts signed in on this browser
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SignedInAccount' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: signOutEveryAccount
      summary: End every session this browser holds, for every account signed in on it
      description: >-
        Ends only the sessions this browser presented. The same accounts stay signed in on their
        other devices.
      responses:
        '204':
          description: Every presented session was ended
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List the signed-in account's active sessions
      responses:
        '200':
          description: The account's active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sessions]
      operationId: revokeAllSessions
      summary: Revoke every session for the account, including the current one
      responses:
        '204':
          description: Every session was revoked
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Revoke a single session immediately
      responses:
        '204':
          description: The session was revoked
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/auth-policy:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspaceAuthPolicy
      summary: Read which authentication methods the workspace accepts
      responses:
        '200':
          description: The workspace authentication policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAuthPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [workspaces]
      operationId: setWorkspaceAuthPolicy
      summary: Set which authentication methods the workspace accepts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceAuthPolicyRequest' }
      responses:
        '200':
          description: The updated policy, with recovery codes when single sign-on was required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAuthPolicyOutcome' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/EnforcementRefused' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/oidc:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [sso]
      operationId: getWorkspaceOidcConnection
      summary: Read the workspace single sign-on provider
      responses:
        '200':
          description: The configured provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOidcConnection' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [sso]
      operationId: setWorkspaceOidcConnection
      summary: Configure the workspace single sign-on provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceOidcConnectionRequest' }
      responses:
        '200':
          description: The saved provider, always unverified until it is tested again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOidcConnection' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sso]
      operationId: removeWorkspaceOidcConnection
      summary: Remove the workspace single sign-on provider
      responses:
        '204':
          description: The provider was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/oidc/discover:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [sso]
      operationId: discoverOidcEndpoints
      summary: Read the endpoints a provider advertises, without saving anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverOidcRequest' }
      responses:
        '200':
          description: The endpoints the issuer advertises
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcEndpoints' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/oidc/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [sso]
      operationId: testWorkspaceOidcConnection
      summary: Start a real round trip to the provider that records verification
      responses:
        '200':
          description: Send the browser to this address to complete the test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcAuthorization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/oidc/link:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [sso]
      operationId: linkWorkspaceOidcIdentity
      summary: Connect the signed-in account to its identity at this workspace's provider
      responses:
        '200':
          description: Send the browser to this address to complete the connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcAuthorization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [sso]
      operationId: getWorkspaceSsoProtocol
      summary: Read which single sign-on protocol this workspace uses
      responses:
        '200':
          description: The configured protocol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSsoProtocol' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sso]
      operationId: removeWorkspaceSsoConnection
      summary: Remove the workspace single sign-on provider, whichever protocol it uses
      responses:
        '204':
          description: The provider was removed
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/saml:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [sso]
      operationId: getWorkspaceSamlConnection
      summary: Read the workspace SAML provider
      responses:
        '200':
          description: The configured provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSamlConnection' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [sso]
      operationId: setWorkspaceSamlConnection
      summary: Configure the workspace SAML provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceSamlConnectionRequest' }
      responses:
        '200':
          description: The saved provider, always unverified until it is tested again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSamlConnection' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/SsoFailed' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/sso/saml/metadata:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [sso]
      operationId: readSamlMetadata
      summary: Read a provider's metadata from a URL or pasted document, without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadSamlMetadataRequest' }
      responses:
        '200':
          description: What the metadata describes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamlDescriptor' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
