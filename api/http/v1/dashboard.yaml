        recordedAt: { type: string, format: date-time }
        detail:
          type: object
          additionalProperties: { type: string }

    AuditAction:
      type: string
      enum:
        - session.signed_in
        - session.sign_in_failed
        - session.signed_out
        - session.revoked
        - account.password_changed
        - account.password_reset
        - account.email_changed
        - account.deactivated
        - account.deleted
        - membership.added
        - membership.role_changed
        - membership.removed
        - membership.audit_access_changed
        - team_membership.added
        - team_membership.removed
        - invitation.created
        - invitation.revoked
        - invitation.accepted
        - sso.connection_saved
        - sso.connection_removed
        - sso.enforcement_changed
        - sso.recovery_codes_issued
        - sso.recovery_code_redeemed
        - sso.identity_unlinked
        - sso.identity_linked
        - sso.identity_refused
        - sso.account_opened
        - token.minted
        - token.revoked
        - agent.registered
        - agent.disabled
        - agent.proposal_decided
        - mcp_connection.authorized
        - mcp_connection.narrowed
        - mcp_connection.revoked
        - webhook.registered
        - webhook.removed
        - webhook.disabled
        - workspace.updated
        - workspace.deletion_requested
        - workspace.restored
        - workspace.purged
        - directory.connected
        - directory.disconnected
        - directory.token_rotated
        - audit.exported
        - access.denied

    AuditOutcome:
      type: string
      enum: [succeeded, failed, denied]

    AuditAuthMethod:
      type: string
      enum: [password, sso, api_token, agent, system]

    AuditActor:
      type: object
      required: [kind, authMethod]
      properties:
        accountId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ActivityActorKind' }
        name: { type: string }
        tokenId: { type: string, format: uuid }
        tokenName: { type: string }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        authMethod: { $ref: '#/components/schemas/AuditAuthMethod' }

    AuditEvent:
      type: object
      required: [id, occurredAt, action, outcome, actor]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        actor: { $ref: '#/components/schemas/AuditActor' }
        sourceIp: { type: string }
        userAgent: { type: string }
        resourceKind: { type: string }
        resourceId: { type: string, format: uuid }
        resourceName: { type: string }
        detail:
          type: object
          additionalProperties: { type: string }

    AuditPage:
      type: object
      required: [events, retentionDays]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string }
        retentionDays: { type: integer, format: int32 }

    AuditAvailability:
      type: object
      required: [available, retentionDays]
      properties:
        available: { type: boolean }
        retentionDays: { type: integer, format: int32 }

    SetAuditAccessRequest:
      type: object
      required: [readsAudit]
      properties:
        readsAudit: { type: boolean }

    ActivityPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        nextCursor: { type: string }

    Issue:
      type: object
      required: [id, workspaceId, teamId, teamKey, referenceKey, number, reference, title, description, priority, status, state, labels, version, stateEnteredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamKey: { type: string }
        referenceKey: { type: string }
        version: { type: integer, format: int32 }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        assigneeAccountId: { type: string, format: uuid }
        estimate: { type: integer, format: int32 }
        dueOn: { type: string, format: date }
        stateEnteredAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/IssueStatus' }
        archivedAt: { type: string, format: date-time }
        parentId: { type: string, format: uuid }
        parentReference: { type: string }
        depth: { type: integer, format: int32 }
        cycleId: { type: string, format: uuid }
        cycleNumber: { type: integer, format: int32 }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        childProgress: { $ref: '#/components/schemas/IssueProgress' }
        blocked: { type: boolean }
        state: { $ref: '#/components/schemas/IssueState' }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        number: { type: integer, format: int32 }
        reference: { type: string }
        title: { type: string }
        createdByAccountId: { type: string, format: uuid }
        triageState: { $ref: '#/components/schemas/TriageState' }
        triageSource: { $ref: '#/components/schemas/TriageSource' }
        triageDecidedByAccountId: { type: string, format: uuid }
        triageDecidedByName: { type: string }
        triageDecidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    IssueState:
      type: object
      required: [id, name, category, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/StateCategory' }
        position: { type: integer, format: int32 }

    TriageState:
      type: string
      description: Absent when the issue never went through triage.
      enum: [waiting, accepted, declined, merged]

    TriageSource:
      type: string
      description: Who filed it, as the routing rules see them.
      enum: [user, token, agent]

    TriageQueue:
      type: object
      required: [issues, teams]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: string }
        teams:
          type: array
          description: How many are waiting on each team, within the caller's own visibility
          items: { $ref: '#/components/schemas/IssueGroupTally' }

    TriageSettings:
      type: object
      required: [teamId, routeAgents, routeIntegrations, routeNonMembers]
      properties:
        teamId: { type: string, format: uuid }
        routeAgents: { type: boolean }
        routeIntegrations: { type: boolean }
        routeNonMembers:
          type: boolean
          description: Hold issues filed by someone who is not on this team

    SetTriageSettingsRequest:
      type: object
      required: [routeAgents, routeIntegrations, routeNonMembers]
      properties:
        routeAgents: { type: boolean }
        routeIntegrations: { type: boolean }
        routeNonMembers: { type: boolean }

    TriageDeclineReason:
      type: string
      enum: [not_reproducible, working_as_intended, out_of_scope, no_response]

    DeclineTriageIssueRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/TriageDeclineReason' }
        note:
          type: string
          description: Sent to whoever reported it, and kept in the issue's history

    MergeTriageIssueRequest:
      type: object
      required: [duplicateOfId]
      properties:
        duplicateOfId:
          type: string
          format: uuid
          description: The issue that survives; this one is recorded as duplicating it

    ReassignTriageIssueRequest:
      type: object
      required: [teamId, expectedVersion]
      properties:
        teamId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int32 }
        acknowledgeLabelLoss: { type: boolean }

    SavedViewSharing:
      type: string
      enum: [personal, team, workspace]

    SavedView:
      type: object
      required: [id, workspaceId, name, sharing, filter, sort, editable, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        createdByAccountId: { type: string, format: uuid }
        createdByName: { type: string }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }
        editable:
          type: boolean
          description: >-
            Whether this caller may change this view. A shared view is evaluated with the
            permissions of whoever opens it, so two people may legitimately be shown different
            results, and different rights, for one view.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IssueFilterReferenceState:
      type: string
      description: >-
        resolved - it exists and the caller may see it. restricted - it exists but sits on a team
        the caller cannot see, so it is named to nobody. missing - nothing in this workspace has
        that id any more.
      enum: [resolved, restricted, missing]

    IssueFilterReference:
      type: object
      required: [field, value, state]
      properties:
        field: { $ref: '#/components/schemas/IssueFilterField' }
        value: { type: string }
        state: { $ref: '#/components/schemas/IssueFilterReferenceState' }
        name:
          type: string
          description: Present only when the state is resolved.

    SavedViewDetail:
      type: object
      required: [view, references]
      properties:
        view: { $ref: '#/components/schemas/SavedView' }
        references:
          type: array
          items: { $ref: '#/components/schemas/IssueFilterReference' }

    CreateSavedViewRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }

    UpdateSavedViewRequest:
      type: object
      properties:
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }

    ReorderSavedViewsRequest:
      type: object
      required: [savedViewIds]
      properties:
        savedViewIds:
          type: array
          items: { type: string, format: uuid }

    SavedViewConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [saved_view_shared]
            sharing: { $ref: '#/components/schemas/SavedViewSharing' }
            teamName: { type: string }

    IssueFilter:
      type: object
      description: >-
        A tree of conditions. A node is exactly one of all, any, not, or a leaf condition;
        a node that combines two forms is refused rather than guessed at.
      properties:
        all:
          type: array
          items: { $ref: '#/components/schemas/IssueFilter' }
        any:
          type: array
          items: { $ref: '#/components/schemas/IssueFilter' }
        not: { $ref: '#/components/schemas/IssueFilter' }
        field: { $ref: '#/components/schemas/IssueFilterField' }
        op: { $ref: '#/components/schemas/IssueFilterOp' }
        values:
          type: array
          items: { type: string }

    IssueFilterField:
      type: string
      enum:
        - team
        - state
        - stateCategory
        - priority
        - status
        - assignee
        - creator
        - label
        - project
        - cycle
        - createdAt
        - updatedAt
        - dueOn
        - completedAt
        - estimate
        - blocked
        - hasChildren
        - isChild

    IssueFilterOp:
      type: string
      enum:
        - is
        - is_not
        - in
        - not_in
        - is_set
        - is_not_set
        - has_any
        - has_all
        - has_none
        - before
        - after
        - on
        - eq
        - lt
        - gt
        - is_true
        - is_false

    IssueSortField:
      type: string
      enum: [createdAt, updatedAt, priority, dueOn, state, estimate]

    IssueSort:
      type: object
      required: [field]
      properties:
        field: { $ref: '#/components/schemas/IssueSortField' }
        descending: { type: boolean }

    IssueGroupBy:
      type: string
      enum: [state, stateCategory, priority, assignee, team, project, cycle, label]

    IssueGroupTally:
      type: object
      required: [key, issues]
      properties:
        key:
          type: string
          description: The id or enum value the group is keyed on; empty when the property is unset
        issues: { type: integer, format: int32 }

    IssueQueryRequest:
      type: object
      properties:
        text: { type: string, maxLength: 256 }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }
        limit: { type: integer, format: int32, minimum: 1, maximum: 200 }
        cursor: { type: string }

    IssueQueryResult:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: string }
        groups:
          type: array
          description: >-
            Present when a grouping was asked for. Grouping by label counts an issue once per
            label it carries, so those tallies sum to more than the issues returned.
          items: { $ref: '#/components/schemas/IssueGroupTally' }

    IssuePage:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: string }

    CreateIssueRequest:
      type: object
      required: [teamId, title]
      properties:
        teamId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        assigneeId: { type: string, format: uuid }
        estimate: { type: integer, format: int32 }
        dueOn: { type: string, format: date }
        stateId:
          type: string
          format: uuid
          description: A state on the team; absent files the issue into the team's default state
        projectId: { type: string, format: uuid }
        labelIds:
          type: array
          items: { type: string, format: uuid }

    AccountKind:
      type: string
      enum: [person, agent]

    AgentStatus:
      type: string
      enum: [active, disabled]

    Agent:
      type: object
      required: [id, workspaceId, accountId, ownerAccountId, name, status, actionLimit, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        ownerAccountId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        actionLimit:
          type: integer
          format: int32
          description: Actions this agent may take per minute.
        disabledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceAgent:
      type: object
      required: [agent, ownerName, ownerEmail]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        ownerName: { type: string }
        ownerEmail: { type: string }

    RegisterAgentRequest:
      type: object
      required: [name, scopes, allTeams]
      properties:
        name: { type: string }
        ownerAccountId:
          type: string
          format: uuid
          description: Defaults to whoever is registering it.
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        allTeams: { type: boolean }
        teamIds:
          type: array
          items: { type: string, format: uuid }
        actionLimit: { type: integer, format: int32 }

    RegisteredAgent:
      type: object
      required: [agent, value]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        value: { type: string }

    AgentSettings:
      type: object
      required: [holdComments, holdStateChanges, holdIssueEdits]
      properties:
        holdComments: { type: boolean }
        holdStateChanges: { type: boolean }
        holdIssueEdits: { type: boolean }

    AgentAction:
      type: string
      enum: [comment, state_change, issue_edit]

    AgentProposalStatus:
      type: string
      enum: [pending, rejected, applied, failed]

    AgentProposal:
      type: object
      required: [id, agentId, agentName, issueId, teamId, action, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        issueId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/AgentAction' }
        status: { $ref: '#/components/schemas/AgentProposalStatus' }
        body: { type: string }
        stateId: { type: string, format: uuid }
        title: { type: string }
        decidedByAccountId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        failure: { type: string }
        createdAt: { type: string, format: date-time }

    AgentUnusableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - agent_name_taken
                - agent_owner_invalid
                - agent_disabled
                - agent_proposal_settled

    AgentHeldProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, proposalId]
          properties:
            code:
              type: string
              enum: [agent_action_held]
            proposalId: { type: string, format: uuid }

    APIScope:
      type: string

    APITokenGrant:
      type: object
      required: [workspaceId, allTeams]
      properties:
        workspaceId: { type: string, format: uuid }
        allTeams:
          type: boolean
          description: When true the token reaches every team its owner can see in this workspace.
        teamIds:
          type: array
          items: { type: string, format: uuid }

    APIToken:
      type: object
      required: [id, name, scopes, grants, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/APITokenGrant' }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceAPIToken:
      type: object
      required: [token, ownerName, ownerEmail]
      properties:
        token: { $ref: '#/components/schemas/APIToken' }
        ownerName: { type: string }
        ownerEmail: { type: string }

    MintedAPIToken:
      type: object
      required: [token, value]
      properties:
        token: { $ref: '#/components/schemas/APIToken' }
        value: { type: string }

    MintAPITokenRequest:
      type: object
      required: [name, scopes, grants]
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/APITokenGrant' }
        expiresAt: { type: string, format: date-time }

    MCPCapability:
      type: string
      description: What the connection may do — read everything its owner can see, or also write.
      enum: [read, write]

    MCPConnection:
      type: object
      required: [id, clientName, capability, followsMembership, grants, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientName: { type: string }
        capability: { $ref: '#/components/schemas/MCPCapability' }
        followsMembership:
          type: boolean
          description: >-
            When true the connection reaches every workspace its owner belongs to, including
            ones joined after authorization. When false it is narrowed to the listed grants.
        grants:
          type: array
          items: { $ref: '#/components/schemas/APITokenGrant' }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceMCPConnection:
      type: object
      required: [connection, ownerName, ownerEmail]
      properties:
        connection: { $ref: '#/components/schemas/MCPConnection' }
        ownerName: { type: string }
        ownerEmail: { type: string }

    MCPAuthorizationWorkspace:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }

    MCPAuthorizationView:
      type: object
      required: [clientName, capability, workspaces]
      properties:
        clientName: { type: string }
        capability: { $ref: '#/components/schemas/MCPCapability' }
        workspaces:
          type: array
          description: Every workspace the grant would reach today; future ones join automatically.
          items: { $ref: '#/components/schemas/MCPAuthorizationWorkspace' }

    MCPAuthorizationDecision:
      type: object
      required: [redirectTo]
      properties:
        redirectTo: { type: string }

    NarrowMCPConnectionRequest:
      type: object
      properties:
        capability: { $ref: '#/components/schemas/MCPCapability' }
        grants:
          type: array
          description: Replaces the connection's reach; must shrink it, never widen it.
          items: { $ref: '#/components/schemas/APITokenGrant' }

    WebhookEventType:
      type: string
      enum:
        - issue.created
        - issue.updated
        - issue.status_changed
        - issue.deleted
        - issue.triaged
        - issue.merged
        - comment.posted
        - comment.edited
        - comment.deleted
        - project.created
        - project.updated
        - project.deleted
        - project.members_changed
        - project.status_posted
        - cycle.started
        - cycle.closed
        - cycle.cadence_changed
        - membership.added
        - membership.changed
        - membership.removed
        - team_membership.added
        - team_membership.removed

    WebhookDeliveryEventType:
      type: string
      description: Every subscribable event, plus the test event a delivery may carry.
      enum:
        - issue.created
        - issue.updated
        - issue.status_changed
        - issue.deleted
        - issue.triaged
        - issue.merged
        - comment.posted
        - comment.edited
        - comment.deleted
        - project.created
        - project.updated
        - project.deleted
        - project.members_changed
        - project.status_posted
        - cycle.started
        - cycle.closed
        - cycle.cadence_changed
        - membership.added
        - membership.changed
        - membership.removed
        - team_membership.added
        - team_membership.removed
        - webhook.test

    WebhookDeliveryState:
      type: string
      enum: [pending, succeeded, failed]

    WebhookAttemptOutcome:
      type: string
      enum: [succeeded, rejected, refused, timed_out, failed]

    WebhookDisableReason:
      type: string
      enum: [by_owner, sustained_failure]

    Webhook:
      type: object
      required: [id, name, url, events, secretHint, enabled, failureStreak, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        secretHint: { type: string }
