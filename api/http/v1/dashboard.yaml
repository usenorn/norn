        cycleNumber: { type: integer, format: int32 }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        projectSlug: { type: string }
        childProgress: { $ref: '#/components/schemas/IssueProgress' }
        blocked: { type: boolean }
        state: { $ref: '#/components/schemas/IssueState' }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        number: { type: integer, format: int32 }
        reference: { type: string }
        title: { type: string }
        createdByAccountId: { type: string, format: uuid }
        triageState: { $ref: '#/components/schemas/TriageState' }
        triageSource: { $ref: '#/components/schemas/TriageSource' }
        triageDecidedByAccountId: { type: string, format: uuid }
        triageDecidedByName: { type: string }
        triageDecidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    IssueState:
      type: object
      required: [id, name, category, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/StateCategory' }
        position: { type: integer, format: int32 }

    TriageState:
      type: string
      description: Absent when the issue never went through triage.
      enum: [waiting, accepted, declined, merged]

    TriageSource:
      type: string
      description: Who filed it, as the routing rules see them.
      enum: [user, token, agent]

    TriageQueue:
      type: object
      required: [issues, teams]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: string }
        teams:
          type: array
          description: How many are waiting on each team, within the caller's own visibility
          items: { $ref: '#/components/schemas/IssueGroupTally' }

    TriageSettings:
      type: object
      required: [teamId, routeAgents, routeIntegrations, routeNonMembers]
      properties:
        teamId: { type: string, format: uuid }
        routeAgents: { type: boolean }
        routeIntegrations: { type: boolean }
        routeNonMembers:
          type: boolean
          description: Hold issues filed by someone who is not on this team

    SetTriageSettingsRequest:
      type: object
      required: [routeAgents, routeIntegrations, routeNonMembers]
      properties:
        routeAgents: { type: boolean }
        routeIntegrations: { type: boolean }
        routeNonMembers: { type: boolean }

    TriageDeclineReason:
      type: string
      enum: [not_reproducible, working_as_intended, out_of_scope, no_response]

    DeclineTriageIssueRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/TriageDeclineReason' }
        note:
          type: string
          description: Sent to whoever reported it, and kept in the issue's history

    MergeTriageIssueRequest:
      type: object
      required: [duplicateOfId]
      properties:
        duplicateOfId:
          type: string
          format: uuid
          description: The issue that survives; this one is recorded as duplicating it

    ReassignTriageIssueRequest:
      type: object
      required: [teamId, expectedVersion]
      properties:
        teamId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int32 }
        acknowledgeLabelLoss: { type: boolean }

    SavedViewSharing:
      type: string
      enum: [personal, team, workspace]

    SavedView:
      type: object
      required: [id, workspaceId, name, sharing, filter, sort, editable, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        createdByAccountId: { type: string, format: uuid }
        createdByName: { type: string }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }
        editable:
          type: boolean
          description: >-
            Whether this caller may change this view. A shared view is evaluated with the
            permissions of whoever opens it, so two people may legitimately be shown different
            results, and different rights, for one view.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IssueFilterReferenceState:
      type: string
      description: >-
        resolved - it exists and the caller may see it. restricted - it exists but sits on a team
        the caller cannot see, so it is named to nobody. missing - nothing in this workspace has
        that id any more.
      enum: [resolved, restricted, missing]

    IssueFilterReference:
      type: object
      required: [field, value, state]
      properties:
        field: { $ref: '#/components/schemas/IssueFilterField' }
        value: { type: string }
        state: { $ref: '#/components/schemas/IssueFilterReferenceState' }
        name:
          type: string
          description: Present only when the state is resolved.

    SavedViewDetail:
      type: object
      required: [view, references]
      properties:
        view: { $ref: '#/components/schemas/SavedView' }
        references:
          type: array
          items: { $ref: '#/components/schemas/IssueFilterReference' }

    CreateSavedViewRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }

    UpdateSavedViewRequest:
      type: object
      properties:
        name: { type: string }
        sharing: { $ref: '#/components/schemas/SavedViewSharing' }
        teamId: { type: string, format: uuid }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }

    ReorderSavedViewsRequest:
      type: object
      required: [savedViewIds]
      properties:
        savedViewIds:
          type: array
          items: { type: string, format: uuid }

    SavedViewConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [saved_view_shared]
            sharing: { $ref: '#/components/schemas/SavedViewSharing' }
            teamName: { type: string }

    IssueFilter:
      type: object
      description: >-
        A tree of conditions. A node is exactly one of all, any, not, or a leaf condition;
        a node that combines two forms is refused rather than guessed at.
      properties:
        all:
          type: array
          items: { $ref: '#/components/schemas/IssueFilter' }
        any:
          type: array
          items: { $ref: '#/components/schemas/IssueFilter' }
        not: { $ref: '#/components/schemas/IssueFilter' }
        field: { $ref: '#/components/schemas/IssueFilterField' }
        op: { $ref: '#/components/schemas/IssueFilterOp' }
        values:
          type: array
          items: { type: string }

    IssueFilterField:
      type: string
      enum:
        - team
        - state
        - stateCategory
        - priority
        - status
        - assignee
        - creator
        - label
        - project
        - cycle
        - createdAt
        - updatedAt
        - dueOn
        - completedAt
        - estimate
        - blocked
        - hasChildren
        - isChild

    IssueFilterOp:
      type: string
      enum:
        - is
        - is_not
        - in
        - not_in
        - is_set
        - is_not_set
        - has_any
        - has_all
        - has_none
        - before
        - after
        - on
        - eq
        - lt
        - gt
        - is_true
        - is_false

    IssueSortField:
      type: string
      description: >-
        `rank` is the order people drag issues into. Every other field is a property of the issue.
      enum: [createdAt, updatedAt, priority, dueOn, state, estimate, rank]

    IssueSort:
      type: object
      required: [field]
      properties:
        field: { $ref: '#/components/schemas/IssueSortField' }
        descending: { type: boolean }

    IssueGroupBy:
      type: string
      enum: [state, stateCategory, priority, assignee, team, project, cycle, label]

    IssueGroupTally:
      type: object
      required: [key, issues]
      properties:
        key:
          type: string
          description: The id or enum value the group is keyed on; empty when the property is unset
        issues: { type: integer, format: int32 }
        nextCursor:
          type: string
          description: >-
            The position after the rows this group contributed to `issues`, sent back as `cursor`
            on a query narrowed to this group. Absent when the group is complete, and absent when
            the group contributed nothing at all, which is paged from the start instead.

    IssueQueryRequest:
      type: object
      properties:
        text: { type: string, maxLength: 256 }
        filter: { $ref: '#/components/schemas/IssueFilter' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/IssueSort' }
        groupBy: { $ref: '#/components/schemas/IssueGroupBy' }
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: >-
            The most rows `issues` may hold. With `perGroup` it is the budget every group spends
            from, and defaults to the maximum rather than the page default.
        perGroup:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          description: >-
            Return the first rows of every group instead of one flat page. Requires `groupBy`, and
            is refused together with `cursor`, which names a position in the whole ordering rather
            than in one group. Groups fill rank by rank, so no group loses its first row while
            another still has a second.
        cursor:
          type: string
          description: A position from a previous `nextCursor`. Refused together with `perGroup`.

    IssueQueryResult:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor:
          type: string
          description: Absent when `perGroup` was asked for, since each group carries its own.
        groups:
          type: array
          description: >-
            Present when a grouping was asked for, one entry per group holding at least one match,
            counted over the whole filtered set. With `perGroup`, the rows a group contributed to
            `issues` are the first rows of that group in the requested order, so a group counting
            more than it contributed was cut short by a limit rather than by a filter. Grouping by
            label counts an issue once per label it carries, though `issues` still lists it once.
          items: { $ref: '#/components/schemas/IssueGroupTally' }

    IssuePage:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
        nextCursor: { type: string }

    CreateIssueRequest:
      type: object
      required: [teamId, title]
      properties:
        teamId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        assigneeId: { type: string, format: uuid }
        estimate: { type: integer, format: int32 }
        dueOn: { type: string, format: date }
        stateId:
          type: string
          format: uuid
          description: A state on the team; absent files the issue into the team's default state
        projectId: { type: string, format: uuid }
        labelIds:
          type: array
          items: { type: string, format: uuid }
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }

    AccountKind:
      type: string
      description: >-
        An integration account is one Norn created to stand behind a source control
        connection. It authors the content that connection mirrors, so it reaches every
        surface that names an author even though nobody signs in as it.
      enum: [person, agent, integration]

    AgentStatus:
      type: string
      enum: [active, disabled]

    AgentIcon:
      type: string
      enum:
        - bot
        - inbox
        - search
        - terminal
        - pencil
        - git-pull-request
        - shield-check
        - scroll-text
        - target
        - sparkles

    Agent:
      type: object
      required: [id, workspaceId, accountId, ownerAccountId, name, icon, status, actionLimit, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        ownerAccountId: { type: string, format: uuid }
        name: { type: string }
        icon: { $ref: '#/components/schemas/AgentIcon' }
        status: { $ref: '#/components/schemas/AgentStatus' }
        actionLimit:
          type: integer
          format: int32
          description: Actions this agent may take per minute.
        disabledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceAgent:
      type: object
      required: [agent, ownerName, ownerEmail, authority]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        ownerName: { type: string }
        ownerEmail: { type: string }
        authority: { $ref: '#/components/schemas/AgentAuthority' }

    AgentAuthority:
      type: object
      required: [scopes, allTeams, teamIds]
      properties:
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        allTeams: { type: boolean }
        teamIds:
          type: array
          items: { type: string, format: uuid }

    RegisterAgentRequest:
      type: object
      required: [name, scopes, allTeams]
      properties:
        name: { type: string }
        icon: { $ref: '#/components/schemas/AgentIcon' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        allTeams: { type: boolean }
        teamIds:
          type: array
          items: { type: string, format: uuid }
        actionLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 6000

    RegisteredAgent:
      type: object
      required: [agent, value]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        value: { type: string }

    AgentSource:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 200 }
        url: { type: string, maxLength: 2048 }

    AgentReasoning:
      type: object
      description: >-
        What the agent saw, what it read, and what it is unsure about, so deciding a proposal is
        a read rather than an investigation.
      properties:
        observed: { type: string, maxLength: 4000 }
        consulted:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentSource' }
        uncertain: { type: string, maxLength: 4000 }

    AgentHold:
      type: string
      description: Whether a write of this kind waits for a person.
      enum: [never, always]

    AgentSettings:
      type: object
      required: [holdComments, holdStateChanges, holdIssueEdits, holdIssueCreation]
      properties:
        holdComments: { $ref: '#/components/schemas/AgentHold' }
        holdStateChanges: { $ref: '#/components/schemas/AgentHold' }
        holdIssueEdits: { $ref: '#/components/schemas/AgentHold' }
        holdIssueCreation: { $ref: '#/components/schemas/AgentHold' }

    AgentAction:
      type: string
      enum: [comment, state_change, issue_edit, issue_create]

    AgentProposalStatus:
      type: string
      enum: [pending, rejected, applied, failed]

    AgentProposal:
      type: object
      required: [id, agentId, agentName, teamId, action, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        issueId:
          type: string
          format: uuid
          description: Absent on a held issue creation, where the issue does not exist yet
        teamId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/AgentAction' }
        status: { $ref: '#/components/schemas/AgentProposalStatus' }
        body: { type: string }
        stateId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }
        issueReference:
          type: string
          description: So an approver can open the issue the proposal is about
        issueTitle: { type: string }
        teamKey:
          type: string
          description: The team a held issue creation would file its issue on
        stateName:
          type: string
          description: The state a state change would move the issue to
        questions:
          type: array
          description: >-
            Questions the agent asked on this issue that nobody answered, so approving the
            proposal also ratifies the default it worked on.
          items: { $ref: '#/components/schemas/IssueQuestion' }
        decidedByAccountId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        failure: { type: string }
        createdAt: { type: string, format: date-time }

    AgentUnusableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - agent_name_taken
                - agent_owner_invalid
                - agent_disabled
                - agent_active
                - agent_authority_missing
                - agent_proposal_settled
                - token_scope_invalid
                - token_scope_exceeds
                - token_may_not_mint
                - token_grant_invalid
                - token_grant_missing

    AgentHeldProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, proposalId]
          properties:
            code:
              type: string
              enum: [agent_action_held]
            proposalId: { type: string, format: uuid }

    IssuedSession:
      type: object
      required: [slot]
      properties:
        slot:
          type: string
          description: >-
            The session this call issued. Name it to act as the account that just signed in,
            which a browser already holding other sessions has no other way to know.

    SignedInWorkspace:
      type: object
      required: [workspace, slot, reachable]
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        slot:
          type: string
          description: The session to name when acting in this workspace.
        reachable:
          type: boolean
          description: >-
            False when the workspace requires single sign-on and no session on this browser was
            issued by its provider.

    SignedInAccount:
      type: object
      required: [account, defaultSlot, workspaces, current]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        defaultSlot:
          type: string
          description: The session to name for anything this account owns outside a workspace.
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/SignedInWorkspace' }
        current:
          type: boolean
          description: True for the account the request that asked was acting as.

    APIScope:
      type: string
      enum:
        - workspace:read
        - workspace:update
        - membership:read
        - membership:manage
        - invitation:read
        - invitation:manage
        - team:read
        - team:manage
        - team_membership:read
        - team_membership:manage
        - issue:read
        - issue:manage
        - cycle:read
        - label:read
        - label:manage
        - project:read
        - project:manage
        - comment:read
        - comment:manage
        - notification:read
        - notification:manage
        - audit_log:read

    APITokenGrant:
      type: object
      required: [workspaceId, allTeams]
      properties:
        workspaceId: { type: string, format: uuid }
        allTeams:
          type: boolean
          description: When true the token reaches every team its owner can see in this workspace.
        teamIds:
          type: array
          items: { type: string, format: uuid }

    APIToken:
      type: object
      required: [id, name, scopes, grants, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/APITokenGrant' }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceAPIToken:
      type: object
      required: [token, ownerName, ownerEmail]
      properties:
        token: { $ref: '#/components/schemas/APIToken' }
        ownerName: { type: string }
        ownerEmail: { type: string }

    MintedAPIToken:
      type: object
      required: [token, value]
      properties:
        token: { $ref: '#/components/schemas/APIToken' }
        value: { type: string }

    MintAPITokenRequest:
      type: object
      required: [name, scopes, grants]
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/APIScope' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/APITokenGrant' }
        expiresAt: { type: string, format: date-time }

    WebhookEventType:
      type: string
      enum:
        - issue.created
        - issue.updated
        - issue.status_changed
        - issue.deleted
        - issue.triaged
        - issue.merged
        - issue.delegated
        - comment.posted
        - comment.edited
        - comment.deleted
        - project.created
        - project.updated
        - project.deleted
        - project.members_changed
        - project.status_posted
        - cycle.started
        - cycle.closed
        - cycle.cadence_changed
        - membership.added
        - membership.changed
        - membership.removed
        - team_membership.added
        - team_membership.removed

    WebhookDeliveryEventType:
      type: string
      description: Every subscribable event, plus the test event a delivery may carry.
      enum:
        - issue.created
        - issue.updated
        - issue.status_changed
        - issue.deleted
        - issue.triaged
        - issue.merged
        - issue.delegated
        - comment.posted
        - comment.edited
        - comment.deleted
        - project.created
        - project.updated
        - project.deleted
        - project.members_changed
        - project.status_posted
        - cycle.started
        - cycle.closed
        - cycle.cadence_changed
        - membership.added
        - membership.changed
        - membership.removed
        - team_membership.added
        - team_membership.removed
        - webhook.test

    WebhookDeliveryState:
      type: string
      enum: [pending, succeeded, failed]

    WebhookAttemptOutcome:
      type: string
      enum: [succeeded, rejected, refused, timed_out, failed]

    WebhookDisableReason:
      type: string
      enum: [by_owner, sustained_failure]

    SourceControlProvider:
      type: string
      description: >-
        `gitea` covers Forgejo as well: Forgejo is a fork of Gitea and serves the same api,
        so one connection type reaches both. It has no hosted service, so a connection to it
        always names the address of somebody's own instance.
      enum: [github, gitlab, gitea]

    SourceControlCapability:
      type: string
      enum:
        [webhooks, reviews, checks, changed_paths, issues, labels, assignees, releases,
         deployments]

    SourceControlStatus:
      type: string
      enum: [connected, broken]

    SourceControlBrokenReason:
      type: string
      enum: [credentials_rejected, repository_unreachable, hook_missing]

    CodeLinkKind:
      type: string
      enum: [branch, commit, change]

    CodeChangeState:
      type: string
      description: >-
        Where a change stands on the forge. Review and conflict are states a change is in
        rather than events that happened to it, which is what lets a rule fire on entering
        one and lets the issue read correctly after a reload.
      enum:
        [draft, open, review_requested, changes_requested, approved, merged, closed,
         reopened, conflicted]

    SourceControlConnection:
      type: object
      description: >-
        One credential against one forge address. A token already reaches every repository
        its owner can see, so repositories hang off the connection rather than each carrying
        its own copy of the secret. The token is never returned; tokenSet says whether one is
        held and tokenHint carries its last few characters so a person can tell which is
        installed.
      required: [id, provider, authKind, tokenSet, tokenHint, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        authKind: { $ref: '#/components/schemas/SourceControlAuthKind' }
        baseUrl: { type: string }
        label: { type: string }
        tokenSet: { type: boolean }
        tokenHint: { type: string }
        accountLogin: { type: string }
        identityLogin: { type: string }
        repositoryCount: { type: integer, format: int32 }
        allowPrivateAddress: { type: boolean }
        caCertificateSet: { type: boolean }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/SourceControlCapability' }
        missingCapabilities:
          type: array
          items: { $ref: '#/components/schemas/SourceControlCapability' }
        status: { $ref: '#/components/schemas/SourceControlStatus' }
        brokenReason: { $ref: '#/components/schemas/SourceControlBrokenReason' }
        brokenDetail: { type: string }
        brokenAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConnectSourceControlRequest:
      type: object
      description: >-
        allowPrivateAddress is a deliberate exception an administrator grants this one
        connection so it may reach a forge on their own network. It is not an instance-wide
        relaxation, and it never opens loopback or the link-local range a cloud provider
        answers on.
      required: [provider]
      properties:
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        baseUrl: { type: string }
        label: { type: string }
        allowPrivateAddress: { type: boolean }
        caCertificate: { type: string, writeOnly: true }
        token: { type: string, writeOnly: true }
        installationHandle: { type: string, writeOnly: true }
        installationId: { type: string, writeOnly: true }

    SourceControlAuthKind:
      type: string
      enum: [token, app]

    SourceControlApplication:
      type: object
      description: >-
        Whether this instance can act as an installed application on a forge, and where a
        person goes to install it. An instance handed an application in its own configuration
        cannot register a second one, so canRegister is false there.
      required: [provider, registered, canRegister]
      properties:
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        registered: { type: boolean }
        canRegister: { type: boolean }
        slug: { type: string }
        installUrl: { type: string }
        installed:
          type: boolean
          description: >-
            Whether the application is installed anywhere yet. Connecting lists the
            installations a person can reach, so with none there is nothing to choose and the
            screen offers installing first. True when the forge could not be asked, so an
            unreachable forge never hides a step.
        installedOn:
          type: array
          description: The accounts the application is installed on, so the screen can name them.
          items: { type: string }
        allowPrivateAddress: { type: boolean }
        caCertificateSet: { type: boolean }

    SourceControlAppRegistration:
      type: object
      description: >-
        What the browser posts to the forge to create an application. The manifest is passed
        through untouched as one form field; state comes back on the redirect and is spent
        once.
      required: [target, state, manifest]
      properties:
        target: { type: string }
        state: { type: string }
        manifest: { type: string }

    SourceControlAppAuthorization:
      type: object
      required: [url]
      properties:
        url: { type: string }

    AvailableSourceControlRepository:
      type: object
      description: >-
        One repository the installation was granted. Choosing from these is the difference
        between connecting a repository and guessing at its name.
      required: [externalId, fullName]
      properties:
        externalId: { type: string }
        fullName: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }

    SourceControlInstallation:
      type: object
      description: >-
        One place the application is installed that the signed-in person administers. The
        handle that produced this list is what connects it, and it is spent when one is
        chosen.
      required: [externalId, accountLogin]
      properties:
        externalId: { type: string }
        accountLogin: { type: string }
        accountKind: { type: string }

    UpdateSourceControlRequest:
      type: object
      properties:
        label: { type: string }

    ReplaceSourceControlTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, writeOnly: true }

    SourceControlRepository:
      type: object
      description: >-
        One repository reached through a connection. pollIntervalSeconds is per repository
        because the sweep exists for the one whose webhook never arrives, and hookInstalled
        is false when the token could not install it — the sweep retries, and until it
        succeeds the address and secret below are what a person installs by hand.
      required: [id, connectionId, provider, fullName, mirrorLabel, hookInstalled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        fullName: { type: string }
        defaultBranch: { type: string }
        url: { type: string }
        mirrorLabel: { type: string }
        syncDirection: { $ref: '#/components/schemas/MirrorDirection' }
        webhooksDisabled: { type: boolean }
        pollIntervalSeconds: { type: integer, format: int32 }
        hookInstalled: { type: boolean }
        routeCount: { type: integer, format: int32 }
        lastSeenAt: { type: string, format: date-time }
        reconciledAt: { type: string, format: date-time }
        reconcileAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MintedSourceControlRepository:
      type: object
      description: >-
        The webhook address and secret are returned once, on the call that created the
        repository. Norn installs the hook itself when the token may; this is what a person
        needs when it may not.
      required: [repository, webhookUrl, webhookSecret]
      properties:
        repository: { $ref: '#/components/schemas/SourceControlRepository' }
        webhookUrl: { type: string }
        webhookSecret: { type: string }

    AddSourceControlRepositoryRequest:
      type: object
      required: [connectionId, fullName]
      properties:
        connectionId: { type: string, format: uuid }
        fullName: { type: string }
        mirrorLabel: { type: string }
        pollIntervalSeconds: { type: integer, format: int32 }

    UpdateSourceControlRepositoryRequest:
      type: object
      properties:
        mirrorLabel: { type: string }
        syncDirection: { $ref: '#/components/schemas/MirrorDirection' }
        webhooksDisabled: { type: boolean }
        pollIntervalSeconds: { type: integer, format: int32 }

    MirrorDirection:
      type: string
      description: >-
        Which way work may flow for a repository. A repository somebody set to read-only is
        never written to, however many pairings it holds.
      enum: [inbound, outbound, both]

    SCMIdentity:
      type: object
      description: >-
        Who somebody is on a forge. It is stated by an administrator rather than discovered:
        a handle that resembles a name is not evidence, and acting on the guess puts work on
        a stranger.
      required: [id, accountId, provider, login]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        login: { type: string }

    SCMRelease:
      type: object
      required: [id, tag, name]
      properties:
        id: { type: string, format: uuid }
        tag: { type: string }
        name: { type: string }
        url: { type: string }
        prerelease: { type: boolean }
        publishedAt: { type: string, format: date-time }

    SCMDeployment:
      type: object
      required: [id, environment, state]
      properties:
        id: { type: string, format: uuid }
        environment: { type: string }
        state: { type: string, enum: [pending, running, succeeded, failed, inactive] }
        url: { type: string }
        occurredAt: { type: string, format: date-time }

    IssueShipping:
      type: object
      description: >-
        Where this issue's work has reached. Reflection only: Norn reads what the platform
        says and never triggers a deployment or owns a release process.
      required: [releases, deployments]
      properties:
        releases:
          type: array
          items: { $ref: '#/components/schemas/SCMRelease' }
        deployments:
          type: array
          items: { $ref: '#/components/schemas/SCMDeployment' }

    MapSCMIdentityRequest:
      type: object
      required: [accountId, provider, login]
      properties:
        accountId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        login: { type: string }

    MirrorConflict:
      type: object
      description: >-
        An edit that lost arbitration, kept whole. A rule that silently discards one side is
        not something a team can live with, so the discarded value is here to be put back.
      required: [id, field, winner, discarded, kept, occurredAt]
      properties:
        id: { type: string, format: uuid }
        field: { type: string }
        winner: { type: string, enum: [norn, source] }
        discarded: { type: string }
        kept: { type: string }
        occurredAt: { type: string, format: date-time }

    SourceControlRoute:
      type: object
      description: >-
        Sends the changes under one path to one team. Matching is by longest prefix, and a
        route whose prefix is empty is the repository's default rather than a separate flag
        that could disagree with it.
      required: [id, repositoryId, teamId, pathPrefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        repositoryId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        pathPrefix: { type: string }
        createdAt: { type: string, format: date-time }

    AddSourceControlRouteRequest:
      type: object
      required: [teamId]
      properties:
        teamId: { type: string, format: uuid }
        pathPrefix: { type: string }

    SourceControlTransitionRule:
      type: object
      description: >-
        Moves a team's issue to a workflow state when its change reaches one on the forge.
        stateName is empty when the state has since been deleted, which takes the rule with
        it rather than leaving it pointing nowhere.
      required: [id, teamId, trigger, stateId]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        trigger: { $ref: '#/components/schemas/CodeChangeState' }
        stateId: { type: string, format: uuid }
        stateName: { type: string }

    SetSourceControlTransitionRuleRequest:
      type: object
      required: [trigger, stateId]
      properties:
        trigger: { $ref: '#/components/schemas/CodeChangeState' }
        stateId: { type: string, format: uuid }

    CodeLink:
      type: object
      description: >-
        Everything needed to render the link is on the link itself, so it survives the
        repository being removed. connected is false once that has happened.
      required: [id, provider, repository, kind, externalId, url, state, connected, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        repository: { type: string }
        kind: { $ref: '#/components/schemas/CodeLinkKind' }
        externalId: { type: string }
        number: { type: integer, format: int32 }
        title: { type: string }
        url: { type: string }
        state: { $ref: '#/components/schemas/CodeChangeState' }
        checks: { $ref: '#/components/schemas/CodeChecks' }
        reviewers:
          type: array
          items: { $ref: '#/components/schemas/CodeReviewer' }
        author: { type: string }
        headBranch: { type: string }
        baseBranch: { type: string }
        detectedIn: { type: string }
        resolving: { type: boolean }
        connected: { type: boolean }
        mergedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CodeChecks:
      type: string
      description: >-
        What the platform's own checks say. Norn reflects this and runs nothing; a suite that
        has not finished is pending rather than passing, because reading green off an
        unfinished run is worse than saying nothing.
      enum: [pending, passing, failing]

    ReviewVerdict:
      type: string
      enum: [requested, commented, approved, changes_requested, dismissed]

    CodeReviewer:
      type: object
      description: >-
        One person's answer on a change. Kept per reviewer rather than reduced to a single
        state, because "two approvals and one asking for changes" is exactly what somebody
        opens the issue to understand.
      required: [login, verdict]
      properties:
        login: { type: string }
        verdict: { $ref: '#/components/schemas/ReviewVerdict' }
        url: { type: string }
        reviewedAt: { type: string, format: date-time }

    TeamSourceControlSettings:
      type: object
      required: [teamId, branchTemplate]
      properties:
        teamId: { type: string, format: uuid }
        branchTemplate: { type: string }

    SetTeamSourceControlSettingsRequest:
      type: object
      properties:
        branchTemplate: { type: string }

    IssueBranchName:
      type: object
      description: >-
        The branch a person copies before starting work. It is generated rather than typed
        because the reference in it is what creates the link in the first place.
      required: [branch]
      properties:
        branch: { type: string }

    SuppressIssueAutomationRequest:
      type: object
      required: [suppressed]
      properties:
        suppressed: { type: boolean }

    LinkIssueCodeRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }

    IssueMirror:
      type: object
      description: >-
        An issue may be paired with one platform issue per repository, not one in the world:
        the same work is often tracked in a service repository and a client one.
      required: [id, provider, repository, externalId, externalNumber, url, origin, connected]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/SourceControlProvider' }
        repository: { type: string }
        externalId: { type: string }
        externalNumber: { type: integer, format: int32 }
        url: { type: string }
        origin: { type: string, enum: [platform, norn] }
        direction: { type: string, enum: [inbound, outbound, both] }
        connected: { type: boolean }
        pulledAt: { type: string, format: date-time }
        pushedAt: { type: string, format: date-time }

    MirrorIssueRequest:
      type: object
      required: [repositoryId, reference]
      properties:
        repositoryId: { type: string, format: uuid }
        reference: { type: string }

    SourceControlDeliveryOutcome:
      type: string
      enum: [applied, ignored, failed]

    SourceControlDelivery:
      type: object
      description: >-
        One thing the platform sent. outcome is the difference between "a link was made" and
        "there was nothing to make", which is the question anybody asks when a link did not
        appear; detail says which, in words.
      required: [id, event, receivedAt]
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        externalId: { type: string }
        outcome: { $ref: '#/components/schemas/SourceControlDeliveryOutcome' }
        detail: { type: string }
        attempt: { type: integer, format: int32 }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time }
        retryAfter: { type: string, format: date-time }

    SourceControlRefusedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - source_control_credentials_rejected
                - source_control_repository_unreachable
                - source_control_destination_refused
                - source_control_provider_unsupported

    SourceControlConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - source_control_already_connected
                - source_control_already_routed
                - source_control_identity_mapped
                - source_control_already_mirrored
                - source_control_team_outside_connection

    SourceControlSealingUnavailableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [source_control_sealing_unavailable] }

    Webhook:
      type: object
      required: [id, name, url, events, secretHint, enabled, failureStreak, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        secretHint: { type: string }
        enabled: { type: boolean }
        disabledAt: { type: string, format: date-time }
        disabledReason: { $ref: '#/components/schemas/WebhookDisableReason' }
        failureStreak: { type: integer, format: int32 }
        lastDeliveredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MintedWebhook:
      type: object
      required: [webhook, secret]
      properties:
        webhook: { $ref: '#/components/schemas/Webhook' }
        secret: { type: string }

    CreateWebhookRequest:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }

    UpdateWebhookRequest:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      required: [id, event, state, attempt, createdAt]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/WebhookDeliveryEventType' }
        state: { $ref: '#/components/schemas/WebhookDeliveryState' }
        attempt: { type: integer, format: int32 }
        subjectKind: { type: string }
        subjectId: { type: string, format: uuid }
        replayOf: { type: string, format: uuid }
        nextAttemptAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WebhookAttempt:
      type: object
      required: [attempt, requestUrl, outcome, startedAt, finishedAt, elapsedMs]
      properties:
        attempt: { type: integer, format: int32 }
        requestUrl: { type: string }
        resolvedAddress: { type: string }
        outcome: { $ref: '#/components/schemas/WebhookAttemptOutcome' }
        statusCode: { type: integer, format: int32 }
        responseExcerpt: { type: string }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        elapsedMs: { type: integer, format: int64 }

    WebhookDeliveryDetail:
      type: object
      required: [delivery, body, attempts]
      properties:
        delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        body: { type: object, additionalProperties: true }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/WebhookAttempt' }

    WebhookDeliveryPage:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/WebhookDelivery' }
        nextCursor: { type: string }

    ImportStatus:
      type: string
      enum: [draft, staging, staged, mapped, executing, imported, reverting, reverted, failed]

    ImportUnknownPolicy:
      type: string
      enum: [create, skip, fail]

    ImportResource:
      type: string
      enum:
        - team
        - workflow_state
        - label_group
        - label
        - project
        - cycle
        - issue
        - issue_parent
        - issue_relation
        - comment
        - attachment
        - embed

    ImportOutcome:
      type: string
      enum:
        - created
        - skipped
        - unattributed
        - adjusted
        - dropped
        - failed
        - deleted
        - archived
        - retained
        - skipped_modified
        - skipped_in_use

    ImportPhase:
      type: string
      enum: [execute, revert]

    ImportMappingKind:
      type: string
      enum: [user, state, priority, label, project, team]

    ImportDecision:
      type: string
      enum: [map, create, unattributed, skip]

    ImportSource:
      type: object
      required: [kind]
      properties:
        kind: { type: string }

    ImportRun:
      type: object
      description: >-
        Staged and processed are counters and nothing here says how many there will be.
        A source is asked for its backlog a page at a time and never for its size.
      required:
        - id
        - sourceKind
        - status
        - sourceSecretSet
        - unknownReferences
        - acknowledgeTriage
        - attempt
        - staged
        - processed
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string }
        sourceLabel: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        requestedBy: { type: string, format: uuid }
        revertedBy: { type: string, format: uuid }
        phaseError: { type: string }
        previewDigest: { type: string }
        acknowledgeTriage: { type: boolean }
        settings: { type: object, additionalProperties: true }
        unknownReferences: { $ref: '#/components/schemas/ImportUnknownPolicy' }
        sourceSecretSet: { type: boolean }
        attempt: { type: integer, format: int32 }
        staged: { type: integer, format: int32 }
        processed: { type: integer, format: int32 }
        stagedAt: { type: string, format: date-time }
        mappedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        revertedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImportRunPage:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/ImportRun' }
        nextCursor: { type: string }

    CreateImportRequest:
      type: object
      required: [sourceKind]
      properties:
        sourceKind: { type: string }
        sourceLabel: { type: string }

    ConfigureImportRequest:
      type: object
      properties:
        apiKey: { type: string, writeOnly: true }
        settings: { type: object, additionalProperties: true }
        unknownReferences: { $ref: '#/components/schemas/ImportUnknownPolicy' }

    ImportFile:
      type: object
      required: [objectKey, fileName]
      properties:
        objectKey: { type: string }
        fileName: { type: string }

    ImportScope:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        detail: { type: string }

    ImportColumn:
      type: object
      required: [index, header]
      properties:
        index: { type: integer, format: int32 }
        header: { type: string }
        proposed: { type: string }
        confidence: { type: string }

    ImportCatalogue:
      type: object
      required: [scopes, columns, notes]
      properties:
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ImportScope' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ImportColumn' }
        notes:
          type: array
          items: { type: string }

    ImportMapping:
      type: object
      required: [kind, sourceKey]
      properties:
        kind: { $ref: '#/components/schemas/ImportMappingKind' }
        sourceKey: { type: string }
        sourceLabel: { type: string }
        sourceEmail: { type: string }
        decision: { $ref: '#/components/schemas/ImportDecision' }
        targetId: { type: string, format: uuid }
        targetValue: { type: string }
        suggestedTargetId: { type: string, format: uuid }
        suggestedReason: { type: string }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }

    ImportMappingPlan:
      type: object
      required: [mappings, complete]
      properties:
        mappings:
          type: array
          items: { $ref: '#/components/schemas/ImportMapping' }
        complete: { type: boolean }

    ImportMappingDecision:
      type: object
      required: [kind, sourceKey, decision]
      properties:
        kind: { $ref: '#/components/schemas/ImportMappingKind' }
        sourceKey: { type: string }
        decision: { $ref: '#/components/schemas/ImportDecision' }
        targetId: { type: string, format: uuid }
        targetValue: { type: string }

    DecideImportMappingsRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ImportMappingDecision' }

    ImportPreviewLine:
      type: object
      required: [resource, outcome]
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        subject: { type: string }
        externalId: { type: string }
        outcome: { $ref: '#/components/schemas/ImportOutcome' }
        detail: { type: string }

    ImportPreview:
      type: object
      required: [digest, created, changed, skipped, unattributed, warnings, triageTeams]
      properties:
        digest: { type: string }
        created:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewLine' }
        changed:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewLine' }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewLine' }
        unattributed:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewLine' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewLine' }
        triageTeams:
          type: array
          items: { type: string }

    ExecuteImportRequest:
      type: object
      required: [previewDigest]
      properties:
        previewDigest: { type: string }
        acknowledgeTriage: { type: boolean }

    ImportLedgerEntry:
      type: object
      required: [resource, createdId, externalId, reference, orderSeq, createdAt]
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        createdId: { type: string, format: uuid }
        externalId: { type: string }
        reference: { type: string }
        orderSeq: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        revertedAt: { type: string, format: date-time }
        revertOutcome: { $ref: '#/components/schemas/ImportOutcome' }

    ImportReportLine:
      type: object
      required: [id, phase, resource, outcome, recordedAt]
      properties:
        id: { type: string, format: uuid }
