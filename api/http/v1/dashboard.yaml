        url: { type: string }

    InvitationBatch:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/InvitationResult' }

    IssuedInvitation:
      type: object
      required: [invitation, url]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        url: { type: string }

    PreviewInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    InvitationPreview:
      type: object
      required: [workspace, email, role, expiresAt, accountExists, ssoEnforced]
      properties:
        workspace: { $ref: '#/components/schemas/InvitationWorkspace' }
        email: { type: string }
        role: { $ref: '#/components/schemas/MembershipRole' }
        expiresAt: { type: string, format: date-time }
        accountExists: { type: boolean }
        ssoEnforced: { type: boolean }

    InvitationWorkspace:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        password: { type: string }

    AcceptedInvitation:
      type: object
      required: [workspace, membership]
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        membership: { $ref: '#/components/schemas/Membership' }
