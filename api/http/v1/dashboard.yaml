        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/tokens/{tokenId}:
    delete:
      tags: [tokens]
      operationId: revokeWorkspaceAPIToken
