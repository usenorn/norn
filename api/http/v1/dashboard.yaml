    ActivityEvent:
      type: object
      description: Everything one operation changed about one subject, read as a single event.
      required: [id, subjectKind, actorKind, changes, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectKind: { $ref: '#/components/schemas/ActivitySubjectKind' }
        issueId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        actorAccountId: { type: string, format: uuid }
        actorName: { type: string }
        actorKind: { $ref: '#/components/schemas/ActivityActorKind' }
        actorTokenName:
          type: string
          description: >-
            The API token that made the change, when one did. Recorded as it was named at the
            time, so revoking the token does not change what the record says happened.
        actorConnectionName:
          type: string
          description: >-
            The AI client connection that made the change, when one did. Recorded as the client
            was named at the time, so revoking the connection does not rewrite history.
        bulkActionId: { type: string, format: uuid }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ActivityChange' }
        createdAt: { type: string, format: date-time }

