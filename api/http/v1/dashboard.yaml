          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/notifications/read:
    post:
      tags: [notifications]
      operationId: readAllWorkspaceNotifications
      summary: Mark everything currently in your inbox as read
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Every notification in the inbox is now read
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/notifications/{subjectKind}/{subjectId}/read:
    post:
      tags: [notifications]
      operationId: readWorkspaceNotification
      summary: Mark one thread as read
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/NotificationSubjectKind'
        - $ref: '#/components/parameters/NotificationSubjectId'
      responses:
        '204':
          description: The thread is now read
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/notifications/{subjectKind}/{subjectId}/snooze:
    post:
      tags: [notifications]
      operationId: snoozeWorkspaceNotification
      summary: Hide one thread until a chosen time
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/NotificationSubjectKind'
        - $ref: '#/components/parameters/NotificationSubjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnoozeNotificationRequest' }
      responses:
        '204':
          description: The thread is hidden until the time given
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/follow:
    get:
      tags: [notifications]
      operationId: getWorkspaceIssueFollow
      summary: Read whether this issue reaches your inbox
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: Your follow state for this issue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueFollow' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [notifications]
      operationId: setWorkspaceIssueFollow
      summary: Follow this issue, or unsubscribe from it without being made unreachable
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueFollow' }
      responses:
        '200':
          description: Your follow state as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueFollow' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/issues/{issueId}/followers:
    get:
      tags: [notifications]
      operationId: listWorkspaceIssueFollowers
      summary: List the people this issue reaches
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: Everyone following this issue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueFollowerList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/notification-settings:
    get:
      tags: [notifications]
      operationId: getWorkspaceNotificationSettings
      summary: Read which events reach you and through which channel
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Your notification settings for the whole workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [notifications]
      operationId: setWorkspaceNotificationSettings
      summary: Choose which events reach you and through which channel
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Your notification settings as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/teams/{teamId}/notification-settings:
    get:
      tags: [notifications]
      operationId: getWorkspaceTeamNotificationSettings
      summary: Read this team's override, falling back to your workspace settings
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: The settings that apply on this team, and whether they are an override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [notifications]
      operationId: setWorkspaceTeamNotificationSettings
      summary: Override your workspace settings for this team alone
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: The override as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [notifications]
      operationId: clearWorkspaceTeamNotificationSettings
      summary: Drop this team's override and go back to your workspace settings
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: The workspace settings that now apply on this team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/search:
    get:
      tags: [search]
      operationId: searchWorkspace
      summary: Find issues, comments, projects, teams and people by typing words
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - name: kinds
          in: query
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/SearchKind' }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 25 }
      responses:
        '200':
          description: One group per kind of thing that matched, each ranked and capped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: norn_session

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MCPRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    MCPConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StateId:
      name: stateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SavedViewId:
      name: savedViewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LabelId:
      name: labelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DirectoryLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    DirectoryCursor:
      name: cursor
      in: query
      schema: { type: string, format: date-time }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    AuditCursor:
      name: cursor
      in: query
      schema: { type: string }
    AuditActorFilter:
      name: actor
      in: query
      schema: { type: string, format: uuid }
    AuditActionFilter:
      name: action
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/AuditAction' }
    AuditResourceKind:
      name: resourceKind
      in: query
      schema: { type: string }
    AuditResourceId:
      name: resourceId
      in: query
      schema: { type: string, format: uuid }
    AuditFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    ActivityLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    ActivityCursor:
      name: cursor
      in: query
      schema: { type: string }
    ActivityOrder:
      name: order
      in: query
      description: Oldest first tells the story forward; newest first shows what just happened.
      schema: { type: string, enum: [oldest, newest] }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Reaction:
      name: reaction
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CommentReaction' }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }

    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryLimit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    WebhookDeliveryCursor:
      name: cursor
      in: query
      schema: { type: string }
    WebhookDeliveryEventFilter:
      name: event
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/WebhookDeliveryEventType' }
    WebhookDeliveryStateFilter:
      name: state
      in: query
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/WebhookDeliveryState' }

    NotificationSubjectKind:
      name: subjectKind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationSubjectKind' }

    NotificationSubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: A problem occurred
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TeamConflict:
      description: The key is taken, or the team or workspace refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/TeamConflictProblem' }

    MembershipConflict:
      description: The membership refuses the change, or the workspace does
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MembershipConflictProblem' }

    SignInRejected:
      description: The email and password did not match
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvalidCredentialsProblem' }

    AccountLocked:
      description: Consecutive failures locked the account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AccountLockedProblem' }

    TooManyAttempts:
      description: The caller exceeded the attempt limit for its address
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RateLimitedProblem' }

    PasswordResetLinkExpired:
      description: The reset link expired, was superseded, or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkExpiredProblem' }

    PasswordResetLinkUsed:
      description: The reset link was already used
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ResetLinkUsedProblem' }

    AgentUnusable:
      description: The agent cannot be registered or its proposal cannot be decided
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AgentUnusableProblem' }
    AgentHeld:
      description: The action is waiting for a person to approve it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AgentHeldProblem' }
    APITokenUnusable:
      description: The token name is taken, or its scopes exceed the caller's rights
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/APITokenUnusableProblem' }

    WorkflowStateConflict:
      description: The state cannot change without leaving the team unusable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkflowStateConflictProblem' }

    StorageRefused:
      description: The file is too big, or the workspace has no room for it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StorageRefusedProblem' }

    CommentConflict:
      description: The comment refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CommentConflictProblem' }

    IssueConflict:
      description: The issue changed since it was read
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/IssueConflictProblem' }

    CycleConflict:
      description: The cycle refuses the change, or needs a decision first
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CycleConflictProblem' }

    ProjectConflict:
      description: The project refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProjectConflictProblem' }

    SavedViewConflict:
      description: The view refuses the change
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SavedViewConflictProblem' }

    LabelConflict:
      description: The label cannot change without losing or duplicating work
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LabelConflictProblem' }

    SsoFailed:
      description: The exchange with the provider broke at a named stage
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SsoProblem' }

    EnforcementRefused:
      description: Single sign-on cannot be required for this workspace yet
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/EnforcementRefusedProblem' }

    Forbidden:
      description: The actor may not perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ForbiddenProblem' }

    SignUpUnavailable:
      description: The instance does not create accounts from the sign-up form
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpClosedProblem' }

    SignUpNotProcessable:
      description: The password could not be screened, or the link could not be sent
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpUnavailableProblem' }

    SignUpLinkExpired:
      description: The sign-up link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpExpiredProblem' }

    SignUpLinkUnusable:
      description: The link was already used, or an account already has the address
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SignUpUnusableProblem' }

    DirectoryUnlicensed:
      description: This instance has no licence covering directory synchronization
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DirectoryUnlicensedProblem' }
    AuditUnlicensed:
      description: This instance has no licence covering the audit log
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/AuditUnlicensedProblem' }
    WebhookDestinationRefused:
      description: The destination is not reachable from this instance
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WebhookDestinationRefusedProblem' }
    WebhookSigningUnavailable:
      description: This instance has no encryption key, so a webhook cannot be signed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WebhookSigningUnavailableProblem' }
    MailUnavailable:
      description: The instance is not configured to send mail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MailUnavailableProblem' }

    BreachCheckUnavailable:
      description: The password breach check could not be completed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BreachCheckUnavailableProblem' }

    InvitationLinkExpired:
      description: The invitation link expired or is unrecognised
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationExpiredProblem' }

    InvitationLinkUnusable:
      description: The invitation was revoked, already accepted, or addressed to someone else
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InvitationUnusableProblem' }

    WorkspaceDeleted:
      description: The workspace is pending deletion and accepts nothing but restore
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/WorkspaceDeletedProblem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }

    InvalidCredentialsProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, attemptsLeft]
          properties:
            code: { type: string, enum: [invalid_credentials] }
            attemptsLeft: { type: integer, format: int32, minimum: 0 }

    AccountLockedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, unlocksAt]
          properties:
            code: { type: string, enum: [account_locked] }
            unlocksAt: { type: string, format: date-time }

    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [rate_limited] }

    ResetLinkExpiredProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_expired] }

    ResetLinkUsedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code: { type: string, enum: [reset_link_used] }

    LabelColor:
      type: string
      enum: [neutral, cyan, blue, violet, orchid, magenta]

    Label:
      type: object
      required: [id, workspaceId, name, color]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }

    LabelGroup:
      type: object
      required: [id, workspaceId, name]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }

    LabelUsage:
      type: object
      required: [issues]
      properties:
        issues: { type: integer, format: int32 }

    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        teamId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }

    IssueStatus:
      type: string
      enum: [active, archived, pending_deletion]

    SetIssueStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/IssueStatus' }
        expectedVersion: { type: integer, format: int32 }

    BulkOutcome:
      type: string
      enum: [applied, unchanged, forbidden, not_found, conflict, invalid]

    BulkActionStatus:
      type: string
      enum: [queued, running, complete, failed]

    BulkChange:
      type: object
      description: Exactly one lifecycle change, or any combination of property changes
      properties:
        stateId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        clearAssignee: { type: boolean }
        addLabelId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/IssuePriority' }
        status: { $ref: '#/components/schemas/IssueStatus' }

    BulkFilter:
      type: object
      description: The set is resolved when the action runs, with the caller's own visibility
      properties:
        teamId: { type: string, format: uuid }
        status:
          type: array
          items: { $ref: '#/components/schemas/IssueStatus' }
        filter: { $ref: '#/components/schemas/IssueFilter' }

