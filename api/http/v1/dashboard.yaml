      tags: [triage]
      operationId: listWorkspaceTriage
      summary: What has arrived and nobody has decided about yet
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The waiting issues, and how many are waiting per team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageQueue' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/triage/{issueId}/accept:
