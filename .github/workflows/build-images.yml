name: build-images

on:
  workflow_call:
    inputs:
      version:
        description: Baked into the api image as NORN_APP_VERSION and labelled on both images.
        required: true
        type: string
      tags:
        description: Newline-separated docker/metadata-action tag directives.
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: norn-api
            dockerfile: Dockerfile.api
            build_args: VERSION
          - image: norn-web
            dockerfile: Dockerfile.web
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args && format('{0}={1}', matrix.build_args, inputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
