apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: norn-compress
  namespace: norn
spec:
  compress:
    encodings:
      - zstd
      - br
      - gzip
    minResponseBodyBytes: 1024
    # includedContentTypes and excludedContentTypes are mutually exclusive in Traefik v3, and
    # the compressor does not skip SSE on its own — flushed data is compressed regardless of
    # minResponseBodyBytes. An allow-list is therefore the only way to keep text/event-stream
    # uncompressed while still compressing HTML and JSON. adapter-node never compresses SSR
    # output, so this is where that happens.
    includedContentTypes:
      - text/html
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/problem+json
      - application/manifest+json
      - image/svg+xml
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: norn-https-redirect
  namespace: norn
spec:
  redirectScheme:
    scheme: https
    permanent: true
