apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: norn-compress
  namespace: norn
spec:
  compress:
    encodings:
      - zstd
      - br
      - gzip
    minResponseBodyBytes: 1024
    # includedContentTypes and excludedContentTypes are mutually exclusive in Traefik v3, and
    # the compressor does not skip SSE on its own — flushed data is compressed regardless of
    # minResponseBodyBytes. An allow-list is therefore the only way to keep text/event-stream
    # uncompressed while still compressing HTML and JSON. adapter-node never compresses SSR
    # output, so this is where that happens.
    includedContentTypes:
      - text/html
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/problem+json
      - application/manifest+json
      - image/svg+xml
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: norn-https-redirect
  namespace: norn
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# norn-https-redirect only rewrites a request that already reached the edge in cleartext, so the
# first navigation to a typed host is still interceptable. HSTS is what removes that round trip,
# and it is applied at the edge so both backends inherit it from one object. Safe on the SSE
# route: a response header does not buffer the stream the way norn-compress would.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: norn-hsts
  namespace: norn
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
