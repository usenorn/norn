apiVersion: apps/v1
kind: Deployment
metadata:
  name: norn-api
  namespace: norn
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: norn-api
  template:
    metadata:
      labels:
        app: norn-api
    spec:
      # SSE streams never complete on their own, so Shutdown always burns the full
      # http.shutdown_timeout (20s) on a pod holding one. 5s preStop + 20s drain + margin.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: norn-api
      imagePullSecrets:
        - name: github
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: ghcr.io/usenorn/norn-api:latest
          args: ["serve"]
          envFrom:
            - secretRef:
                name: norn-app
          env:
            # No automaxprocs in go.mod, so Go would otherwise see the node's 4 CPUs and
            # oversubscribe against the 1-CPU cgroup quota.
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.cpu
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              # Covers EndpointSlice propagation to Traefik so in-flight requests are not
              # routed to a pod that has already received SIGTERM.
              sleep:
                seconds: 5
          # /v1/health is `security: []` in the OpenAPI spec — unauthenticated by design.
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
