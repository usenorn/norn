apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: norn
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: github
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      # An initContainer runs to completion before the seed container starts, which orders the
      # two without needing a shell — the distroless image has none. If migrate fails the whole
      # pod retries, so seed can never run against an unmigrated schema.
      initContainers:
        - name: migrate
          image: ghcr.io/usenorn/norn-api:latest
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: norn-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      # Reconciles the Casbin policy table. Not optional: every authorization check fails
      # against an empty casbin_rule. Needs Valkey as well as Postgres, because the policy
      # watcher subscribes during construction.
      containers:
        - name: seed
          image: ghcr.io/usenorn/norn-api:latest
          args: ["seed"]
          envFrom:
            - secretRef:
                name: norn-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
