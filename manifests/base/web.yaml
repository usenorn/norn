apiVersion: apps/v1
kind: Deployment
metadata:
  name: norn-web
  namespace: norn
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: norn-web
  template:
    metadata:
      labels:
        app: norn-web
    spec:
      # 5s preStop + adapter-node SHUTDOWN_TIMEOUT 30s + margin.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: norn-web
      imagePullSecrets:
        - name: github
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: ghcr.io/usenorn/norn-web:latest
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # Without this adapter-node derives its origin from the socket and SvelteKit's
            # CSRF check rejects every form POST — in production only, since the check is
            # disabled in dev. This is the single value most likely to break the deploy.
            - name: ORIGIN
              value: https://app.norn.so
            # Straight at the Service, bypassing the ingress. $lib/api/server.ts appends /v1.
            - name: INTERNAL_API_ORIGIN
              value: http://norn-api.norn.svc.cluster.local:8080
            # getClientAddress() feeds the x-forwarded-for that server.ts relays to the API,
            # which is what makes the sign-in throttle per-user. XFF_DEPTH counts from the
            # right and Traefik appends the real peer last.
            - name: ADDRESS_HEADER
              value: X-Forwarded-For
            - name: XFF_DEPTH
              value: "1"
            - name: SHUTDOWN_TIMEOUT
              value: "30"
            # adapter-node defaults to 512K, against the API's 4 MiB ceiling.
            - name: BODY_SIZE_LIMIT
              value: 4M
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # There is no health endpoint. /robots.txt is a real static file served ahead of the
          # SvelteKit handler: it proves the event loop is alive without coupling web liveness
          # to API availability.
          startupProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness exercises the full SSR path. / always ends in a 307, which kubelet
          # counts as success without following it.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
