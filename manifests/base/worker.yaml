apiVersion: apps/v1
kind: Deployment
metadata:
  name: norn-worker
  namespace: norn
spec:
  # Exactly one. The worker runs the Asynq server and the Asynq scheduler in the same process,
  # and the scheduler has no leader election — a second replica double-fires every cron.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: maxSurge would briefly run two schedulers and double-enqueue
    # the nightly cycle generation and SAML certificate sweep on every deploy. The cost is a
    # short gap in consumption; tasks queue in Valkey, nothing is lost.
    type: Recreate
  selector:
    matchLabels:
      app: norn-worker
  template:
    metadata:
      labels:
        app: norn-worker
    spec:
      # SIGTERM then asynq.shutdown_timeout 20s, plus margin. No preStop: nothing routes here,
      # so there is no endpoint race to cover.
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: github
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: ghcr.io/usenorn/norn-api:latest
          args: ["worker"]
          envFrom:
            - secretRef:
                name: norn-app
          env:
            - name: NORN_WORKER_HEALTH_ADDR
              value: 0.0.0.0:8090
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: worker
                  resource: limits.cpu
          ports:
            - name: health
              containerPort: 8090
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # readyz round-trips to Redis, the dependency whose stall would silently stop all
          # background work. There is no Service in front of this: readiness is what surfaces
          # a wedged worker, and liveness restarts one whose process is up but not serving.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
